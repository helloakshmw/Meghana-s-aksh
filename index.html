<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#11100f"
    >

    <meta
        name="description"
        content="AKSH Mental Wellness — A Safe Space For Every Mind."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>AKSH — A Safe Space For Every Mind</title>


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="aksh-icon.PNG"
    >


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Allura&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ARRIVAL STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         PAGE TRANSITION
    ====================================================== -->

    <div
        id="pageTransition"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         BACKGROUND VIDEO
         
         IMPORTANT:
         THERE IS ONLY ONE VIDEO ELEMENT.
    ====================================================== -->

    <video
        id="backgroundVideo"
        class="background-video"
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
    >

        <source
            src=""
            type="video/quicktime"
        >

    </video>


    <!-- =====================================================
         VIDEO OVERLAY
    ====================================================== -->

    <div
        id="videoOverlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         TOP HEADER
    ====================================================== -->

    <header class="arrival-header">


        <!-- =================================================
             DATE / DAY — TOP LEFT
        ================================================== -->

        <div
            class="arrival-date"
            aria-label="Current date"
        >

            <span
                id="arrivalDate"
                class="arrival-date-value"
            >
                00.00.0000
            </span>

            <span
                id="arrivalDay"
                class="arrival-day-value"
            >
                Day
            </span>

        </div>


        <!-- =================================================
             AKSH — TOP CENTER
        ================================================== -->

        <a
            href="index.html"
            class="arrival-brand"
            aria-label="AKSH Home"
        >

            <img
                src="aksh-icon.PNG"
                alt="AKSH"
                class="arrival-brand-icon"
            >

            <span
                class="arrival-brand-name"
            >
                AKSH
            </span>

            <span
                class="arrival-brand-tagline"
            >
                A Safe Space For Every Mind
            </span>

        </a>


        <!-- =================================================
             MENU — TOP RIGHT
        ================================================== -->

        <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="arrivalNavigation"
        >

            <span
                class="menu-line menu-line-one"
                aria-hidden="true"
            ></span>

            <span
                class="menu-line menu-line-two"
                aria-hidden="true"
            ></span>

        </button>

    </header>


    <!-- =====================================================
         MAIN ARRIVAL CONTENT
    ====================================================== -->

    <main class="arrival-main">


        <!-- =================================================
             CENTER CONTENT
        ================================================== -->

        <section
            class="arrival-content"
            aria-labelledby="timeGreeting"
        >

            <p
                id="timeGreeting"
                class="time-greeting"
            >
                Welcome
            </p>


            <p
                id="arrivalMessage"
                class="arrival-message"
            >
                Take a moment to arrive.
            </p>


            <!-- =================================================
                 BEGIN JOURNEY
            ================================================== -->

            <button
                id="beginButton"
                class="begin-button"
                type="button"
            >

                <span class="begin-button-text">
                    Begin Your Journey
                </span>

                <span
                    class="begin-button-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </button>

        </section>


    </main>


    <!-- =====================================================
         BOTTOM CONTROLS
    ====================================================== -->

    <div class="arrival-bottom">


        <!-- =================================================
             SOUND BUTTON
        ================================================== -->

        <button
            id="soundButton"
            class="sound-button"
            type="button"
            aria-label="Enable sound"
            aria-pressed="false"
        >

            <span
                class="sound-symbol"
                aria-hidden="true"
            >
                ◌
            </span>

            <span
                data-sound-text
            >
                Sound Off
            </span>

        </button>


        <!-- =================================================
             MEGHANA SIGNATURE / PHOTO
        ================================================== -->

        <a
            href="meghana-kaverappa.html"
            class="meghana-arrival"
            aria-label="Meet Meghana Kaverappa"
        >

            <span
                class="meghana-name"
            >
                Meghana Kaverappa
            </span>

            <img
                src="meghana.kaverappa.PNG"
                alt="Meghana Kaverappa"
                class="meghana-photo"
            >

        </a>

    </div>


    <!-- =====================================================
         VIDEO PROGRESS
         
         NO VIDEO NUMBER.
         ONLY A SUBTLE PROGRESS LINE.
    ====================================================== -->

    <div
        class="video-progress"
        aria-hidden="true"
    >

        <div
            id="videoProgressBar"
            class="video-progress-bar"
        ></div>

    </div>


    <!-- =====================================================
         HIDDEN VIDEO INDICATOR
         
         Kept only for JS compatibility.
         It does NOT display any video count.
    ====================================================== -->

    <span
        id="videoIndicator"
        hidden
        aria-hidden="true"
    ></span>


    <!-- =====================================================
         FULLSCREEN NAVIGATION
    ====================================================== -->

    <aside
        id="arrivalNavigation"
        class="arrival-navigation"
        aria-hidden="true"
    >


        <!-- =================================================
             CLOSE MENU
        ================================================== -->

        <button
            id="closeMenuButton"
            class="close-menu-button"
            type="button"
            aria-label="Close navigation"
        >

            <span
                aria-hidden="true"
            ></span>

            <span
                aria-hidden="true"
            ></span>

        </button>


        <!-- =================================================
             NAVIGATION CONTENT
        ================================================== -->

        <div class="arrival-navigation-inner">


            <p class="navigation-caption">
                Explore AKSH
            </p>


            <nav
                class="navigation-links"
                aria-label="Main navigation"
            >


                <a
                    href="index.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        01
                    </span>

                    <span>
                        The World
                    </span>

                </a>


                <a
                    href="the-mind.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        02
                    </span>

                    <span>
                        The Mind
                    </span>

                </a>


                <a
                    href="with-you.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        03
                    </span>

                    <span>
                        With You
                    </span>

                </a>


                <a
                    href="meghana-kaverappa.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        04
                    </span>

                    <span>
                        Meghana
                    </span>

                </a>


                <a
                    href="journey.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        05
                    </span>

                    <span>
                        Journey
                    </span>

                </a>


                <a
                    href="stories.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        06
                    </span>

                    <span>
                        Stories
                    </span>

                </a>


                <a
                    href="journal.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        07
                    </span>

                    <span>
                        Journal
                    </span>

                </a>


                <a
                    href="ai.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        08
                    </span>

                    <span>
                        AKSH AI
                    </span>

                </a>


                <a
                    href="booking.html"
                    class="navigation-link"
                >

                    <span class="navigation-number">
                        09
                    </span>

                    <span>
                        Book a Session
                    </span>

                </a>


            </nav>

        </div>

    </aside>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
