<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080908"
    >

    <meta
        name="description"
        content="AKSH — A Safe Space for Every Mind."
    >

    <title>AKSH — A Safe Space for Every Mind</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================================
         ARRIVAL
    ========================================== -->

    <main id="arrivalPage" class="arrival-page">


        <!-- BACKGROUND VIDEO -->

        <video
            id="backgroundVideo"
            class="background-video"
            autoplay
            muted
            playsinline
            webkit-playsinline
            preload="auto"
            aria-hidden="true"
        ></video>


        <!-- CINEMATIC OVERLAY -->

        <div
            id="videoOverlay"
            class="video-overlay"
            aria-hidden="true"
        ></div>


        <!-- GRAIN -->

        <div
            class="grain"
            aria-hidden="true"
        ></div>


        <!-- TOP BRAND -->

        <header class="arrival-header">

            <a
                href="index.html"
                class="arrival-brand"
                aria-label="AKSH Home"
            >

                <img
                    src="aksh-icon.PNG"
                    alt="AKSH"
                >

                <span>AKSH</span>

            </a>


            <button
                id="menuButton"
                class="menu-button"
                type="button"
                aria-label="Open navigation"
                aria-controls="arrivalNavigation"
                aria-expanded="false"
            >

                <span></span>
                <span></span>

            </button>

        </header>


        <!-- MAIN ARRIVAL CONTENT -->

        <section class="arrival-content">


            <div class="arrival-brand-mark">

                <img
                    src="aksh-icon.PNG"
                    alt="AKSH"
                >

            </div>


            <p
                id="timeGreeting"
                class="time-greeting"
            >
                Good Evening
            </p>


            <h1
                id="arrivalTitle"
                class="arrival-title"
            >
                A Safe Space<br>
                for Every Mind.
            </h1>


            <p
                id="arrivalMessage"
                class="arrival-message"
            >
                Take a breath.<br>
                There is no need to rush.
            </p>


            <!-- DATE -->

            <div class="arrival-date">

                <span id="currentDate">
                    14.08.2026
                </span>

                <span class="date-divider">
                    /
                </span>

                <span id="currentDay">
                    Friday
                </span>

            </div>


            <!-- BEGIN -->

            <button
                id="beginButton"
                class="begin-button"
                type="button"
            >

                <span class="begin-label">
                    Begin Your Journey
                </span>

                <span
                    class="begin-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </button>


        </section>


        <!-- BOTTOM CONTROLS -->

        <div class="arrival-controls">


            <!-- SOUND -->

            <button
                id="soundButton"
                class="control-button"
                type="button"
                aria-label="Turn sound on"
                aria-pressed="false"
            >

                <span
                    id="soundIcon"
                    class="sound-icon"
                    aria-hidden="true"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span id="soundText">
                    Sound Off
                </span>

            </button>


            <!-- VIDEO PROGRESS -->

            <div
                class="video-progress"
                aria-hidden="true"
            >

                <span
                    id="videoProgressBar"
                ></span>

            </div>


            <!-- VIDEO NUMBER -->

            <div
                id="videoIndicator"
                class="video-indicator"
                aria-live="polite"
            >
                01 / 13
            </div>


        </div>


    </main>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <aside
        id="arrivalNavigation"
        class="arrival-navigation"
        aria-hidden="true"
    >

        <div class="navigation-background"></div>


        <div class="navigation-inner">


            <div class="navigation-top">

                <span>
                    AKSH
                </span>

                <button
                    id="closeMenuButton"
                    class="close-menu-button"
                    type="button"
                    aria-label="Close navigation"
                >
                    ×
                </button>

            </div>


            <nav
                class="navigation-links"
                aria-label="Main navigation"
            >

                <a href="aksh.html">
                    <span>01</span>
                    <strong>AKSH</strong>
                </a>

                <a href="the-world.html">
                    <span>02</span>
                    <strong>THE WORLD</strong>
                </a>

                <a href="the-mind.html">
                    <span>03</span>
                    <strong>THE MIND</strong>
                </a>

                <a href="with-you.html">
                    <span>04</span>
                    <strong>WITH YOU</strong>
                </a>

                <a href="meghana-kaverappa.html">
                    <span>05</span>
                    <strong>MEGHANA</strong>
                </a>

                <a href="the-journey.html">
                    <span>06</span>
                    <strong>THE JOURNEY</strong>
                </a>

                <a href="stories.html">
                    <span>07</span>
                    <strong>STORIES</strong>
                </a>

                <a href="journal.html">
                    <span>08</span>
                    <strong>JOURNAL</strong>
                </a>

                <a href="ai.html">
                    <span>09</span>
                    <strong>AKSH AI</strong>
                </a>

                <a href="booking.html">
                    <span>10</span>
                    <strong>BOOK</strong>
                </a>

            </nav>


            <div class="navigation-footer">

                <span>
                    A SAFE SPACE FOR EVERY MIND
                </span>

            </div>


        </div>

    </aside>


    <!-- =========================================
         PAGE TRANSITION
    ========================================== -->

    <div
        id="pageTransition"
        class="page-transition"
        aria-hidden="true"
    >

        <div class="transition-logo">

            <img
                src="aksh-icon.PNG"
                alt=""
            >

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
