<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#11110f" />

  <title>AKSH — A Safe Space For Every Mind</title>

  <meta
    name="description"
    content="AKSH — A Safe Space For Every Mind."
  />

  <style>
    :root {
      --white: #ffffff;
      --soft-white: rgba(255, 255, 255, 0.88);
      --muted-white: rgba(255, 255, 255, 0.68);
      --glass: rgba(0, 0, 0, 0.16);
      --glass-border: rgba(255, 255, 255, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11110f;
    }

    body {
      color: var(--white);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
    }

    /* =========================================================
       ARRIVAL
    ========================================================= */

    .arrival {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background: #11110f;
    }

    /* =========================================================
       VIDEO
    ========================================================= */

    .video-layer {
      position: absolute;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background: #11110f;
    }

    .background-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      opacity: 0;

      transform: scale(1.03);

      transition:
        opacity 1.3s ease,
        transform 10s ease;

      will-change: opacity, transform;
    }

    .background-video.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Cinematic readability layer */

    .cinematic-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.36) 0%,
          rgba(0, 0, 0, 0.08) 30%,
          rgba(0, 0, 0, 0.08) 58%,
          rgba(0, 0, 0, 0.42) 100%
        );
    }

    .cinematic-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 42%,
          rgba(0, 0, 0, 0.18) 100%
        );
    }

    /* =========================================================
       CONTENT
    ========================================================= */

    .content {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      padding:
        max(24px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));

      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       TOP
    ========================================================= */

    .top {
      position: relative;

      width: 100%;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    /* DATE */

    .date-container {
      padding-top: 3px;
    }

    .date {
      color: var(--white);

      font-size: clamp(11px, 1.3vw, 14px);

      font-weight: 500;

      line-height: 1.3;

      letter-spacing: 0.055em;

      white-space: nowrap;

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.45);
    }

    /* =========================================================
       CENTRE BRAND
    ========================================================= */

    .brand {
      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .brand-icon-wrapper {
      width: 54px;
      height: 54px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.14);

      border: 1px solid rgba(255, 255, 255, 0.34);

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.22);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand-icon {
      width: 36px;
      height: 36px;

      object-fit: contain;

      /* Do NOT invert the original AKSH artwork. */
      filter: none;

      display: block;
    }

    .brand-name {
      margin-top: 9px;

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 0.38em;

      padding-left: 0.38em;

      color: var(--white);

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.5);
    }

    .tagline {
      margin-top: 6px;

      font-size: 8px;

      letter-spacing: 0.13em;

      color: var(--soft-white);

      white-space: nowrap;

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.45);
    }

    /* =========================================================
       SOUND
    ========================================================= */

    .sound-button {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      border: 1px solid rgba(255, 255, 255, 0.34);

      background: rgba(0, 0, 0, 0.14);

      color: white;

      display: grid;
      place-items: center;

      cursor: pointer;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .sound-button:active {
      transform: scale(0.94);
    }

    .sound-button svg {
      width: 17px;
      height: 17px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.4;

      stroke-linecap: round;

      stroke-linejoin: round;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding:
        60px 15px
        80px;
    }

    .greeting {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          54px,
          10vw,
          118px
        );

      line-height: 0.96;

      font-weight: 400;

      letter-spacing: -0.045em;

      color: var(--white);

      text-shadow:
        0 6px 30px rgba(0, 0, 0, 0.34);

      animation:
        greetingIn 1.25s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    .quote {
      max-width: 600px;

      margin-top: 25px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(16px, 1.8vw, 22px);

      line-height: 1.5;

      font-weight: 400;

      color: rgba(255, 255, 255, 0.9);

      text-shadow:
        0 4px 24px rgba(0, 0, 0, 0.38);

      animation:
        quoteIn 1.35s
        0.12s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    .period {
      margin-top: 18px;

      font-size: 9px;

      letter-spacing: 0.3em;

      padding-left: 0.3em;

      color: rgba(255, 255, 255, 0.62);

      text-transform: uppercase;

      animation:
        quoteIn 1.35s
        0.2s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    /* =========================================================
       BOTTOM
    ========================================================= */

    .bottom {
      position: relative;

      min-height: 78px;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .begin-button {
      appearance: none;

      min-width: 225px;

      min-height: 54px;

      padding:
        0 30px;

      border-radius: 999px;

      border:
        1px solid
        rgba(255, 255, 255, 0.62);

      background:
        rgba(0, 0, 0, 0.18);

      color: white;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 16px;

      cursor: pointer;

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 0.22em;

      padding-left:
        calc(30px + 0.22em);

      text-transform: uppercase;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.18);

      transition:
        background 0.35s ease,
        border-color 0.35s ease,
        transform 0.35s ease,
        box-shadow 0.35s ease;

      animation:
        buttonIn 1.4s
        0.25s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    .begin-button:hover {
      background:
        rgba(255, 255, 255, 0.13);

      border-color:
        rgba(255, 255, 255, 0.9);

      transform:
        translateY(-2px);

      box-shadow:
        0 16px 50px rgba(0, 0, 0, 0.24);
    }

    .begin-button:active {
      transform: scale(0.97);
    }

    .arrow {
      width: 18px;
      height: 18px;

      display: grid;
      place-items: center;
    }

    .arrow svg {
      width: 18px;
      height: 18px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.4;

      stroke-linecap: round;

      stroke-linejoin: round;

      transition:
        transform 0.3s ease;
    }

    .begin-button:hover .arrow svg {
      transform: translateX(4px);
    }

    /* =========================================================
       LOADER
    ========================================================= */

    .loader {
      position: absolute;

      inset: 0;

      z-index: 50;

      background: #11110f;

      display: flex;

      align-items: center;

      justify-content: center;

      transition:
        opacity 0.9s ease,
        visibility 0.9s ease;
    }

    .loader.hidden {
      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }

    .loader-icon {
      width: 44px;
      height: 44px;

      object-fit: contain;

      filter: none;

      animation:
        breathe 2s
        ease-in-out
        infinite;
    }

    /* =========================================================
       TRANSITION
    ========================================================= */

    .transition {
      position: absolute;

      inset: 0;

      z-index: 40;

      background: #11110f;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.9s ease;
    }

    .transition.active {
      opacity: 1;

      pointer-events: auto;
    }

    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes greetingIn {
      from {
        opacity: 0;
        transform: translateY(26px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes quoteIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes breathe {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.72;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .content {
        padding:
          max(20px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      .brand-icon-wrapper {
        width: 50px;
        height: 50px;
      }

      .brand-icon {
        width: 34px;
        height: 34px;
      }

      .brand-name {
        margin-top: 7px;

        font-size: 9px;
      }

      .tagline {
        font-size: 7px;
      }

      .date {
        font-size: 10px;
      }

      .sound-button {
        width: 37px;
        height: 37px;
      }

      .hero {
        padding:
          70px 5px
          90px;
      }

      .greeting {
        font-size:
          clamp(
            50px,
            15vw,
            82px
          );
      }

      .quote {
        max-width: 330px;

        font-size: 16px;

        margin-top: 21px;
      }

      .begin-button {
        min-width: 215px;

        min-height: 52px;

        font-size: 9px;
      }
    }

    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-width: 375px) {

      .content {
        padding-left: 15px;
        padding-right: 15px;
      }

      .brand-icon-wrapper {
        width: 46px;
        height: 46px;
      }

      .brand-icon {
        width: 31px;
        height: 31px;
      }

      .tagline {
        display: none;
      }

      .date {
        font-size: 9px;
      }

      .greeting {
        font-size: 48px;
      }

      .quote {
        font-size: 15px;
      }

      .begin-button {
        min-width: 200px;
      }
    }

    /* =========================================================
       LANDSCAPE
    ========================================================= */

    @media (
      max-height: 520px
    ) and (
      orientation: landscape
    ) {

      .content {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .brand-icon-wrapper {
        width: 38px;
        height: 38px;
      }

      .brand-icon {
        width: 27px;
        height: 27px;
      }

      .brand-name {
        margin-top: 3px;
        font-size: 8px;
      }

      .tagline {
        display: none;
      }

      .hero {
        padding:
          20px 10px
          30px;
      }

      .greeting {
        font-size: 48px;
      }

      .quote {
        margin-top: 10px;
        font-size: 13px;
      }

      .period {
        margin-top: 8px;
      }

      .bottom {
        min-height: 55px;
      }

      .begin-button {
        min-height: 44px;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .background-video {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <main class="arrival">

    <!-- =====================================================
         VIDEO
    ====================================================== -->

    <div class="video-layer" aria-hidden="true">

      <video
        id="backgroundVideo"
        class="background-video"
        autoplay
        playsinline
        preload="auto"
        loop
      ></video>

      <div class="cinematic-overlay"></div>
      <div class="cinematic-vignette"></div>

    </div>

    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
      class="loader"
      id="loader"
      aria-hidden="true"
    >
      <img
        class="loader-icon"
        src="aksh-icon.PNG"
        alt=""
      />
    </div>

    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <div class="content">

      <!-- TOP -->

      <header class="top">

        <!-- DATE -->

        <div class="date-container">
          <div
            class="date"
            id="date"
          ></div>
        </div>

        <!-- BRAND -->

        <div class="brand">

          <div class="brand-icon-wrapper">

            <img
              class="brand-icon"
              src="aksh-icon.PNG"
              alt="AKSH"
            />

          </div>

          <div class="brand-name">
            AKSH
          </div>

          <div class="tagline">
            A SAFE SPACE FOR EVERY MIND
          </div>

        </div>

        <!-- SOUND -->

        <button
          class="sound-button"
          id="soundButton"
          type="button"
          aria-label="Turn sound on"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
            <path d="m18 9-4 6"></path>
            <path d="m14 9 4 6"></path>
          </svg>

        </button>

      </header>

      <!-- HERO -->

      <section class="hero">

        <h1
          class="greeting"
          id="greeting"
        >
          Welcome
        </h1>

        <p
          class="quote"
          id="quote"
        >
          Take a moment. You are welcome here.
        </p>

        <div
          class="period"
          id="period"
        >
          AKSH
        </div>

      </section>

      <!-- BOTTOM -->

      <footer class="bottom">

        <button
          class="begin-button"
          id="beginButton"
          type="button"
        >

          <span>
            Begin Your Journey
          </span>

          <span
            class="arrow"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">
              <path d="M5 12h13"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>

          </span>

        </button>

      </footer>

    </div>

    <!-- TRANSITION -->

    <div
      class="transition"
      id="transition"
      aria-hidden="true"
    ></div>

  </main>

  <script>

    /* =========================================================
       AKSH ARRIVAL ENGINE
    ========================================================= */

    const schedule = [

      /* NIGHT */

      {
        start: 0,
        end: 5,
        greeting: "Good Night",
        period: "NIGHT",
        quote:
          "Let the world become quiet. You can simply be.",
        video:
          "aksh-night.2.mov"
      },

      /* MORNING */

      {
        start: 5,
        end: 6,
        greeting: "Good Morning",
        period: "MORNING",
        quote:
          "Begin gently. There is nowhere you need to rush.",
        video:
          "aksh-morning.1.mov"
      },

      {
        start: 6,
        end: 8,
        greeting: "Good Morning",
        period: "MORNING",
        quote:
          "A new day does not ask you to have everything figured out.",
        video:
          "aksh-morning.2.mov"
      },

      {
        start: 8,
        end: 10,
        greeting: "Good Morning",
        period: "MORNING",
        quote:
          "Take a breath. Let this moment be enough.",
        video:
          "aksh-morning.3.mov"
      },

      {
        start: 10,
        end: 12,
        greeting: "Good Morning",
        period: "MORNING",
        quote:
          "There is space here for whatever today brings.",
        video:
          "aksh-morning.4.mov"
      },

      /* AFTERNOON */

      {
        start: 12,
        end: 13,
        greeting: "Good Afternoon",
        period: "AFTERNOON",
        quote:
          "Pause for a moment. You deserve a little space.",
        video:
          "aksh-afternoon.1.mov"
      },

      {
        start: 13,
        end: 14.5,
        greeting: "Good Afternoon",
        period: "AFTERNOON",
        quote:
          "Warm light. A quiet moment. Just be here.",
        video:
          "aksh-afternoon.2.mov"
      },

      {
        start: 14.5,
        end: 16,
        greeting: "Good Afternoon",
        period: "AFTERNOON",
        quote:
          "You do not have to carry everything at once.",
        video:
          "aksh-afternoon.3.mov"
      },

      {
        start: 16,
        end: 17,
        greeting: "Good Afternoon",
        period: "AFTERNOON",
        quote:
          "Even changing skies can hold a little hope.",
        video:
          "aksh-afternoon.4.mov"
      },

      /* EVENING */

      {
        start: 17,
        end: 17.75,
        greeting: "Good Evening",
        period: "EVENING",
        quote:
          "Some beautiful moments arrive when we least expect them.",
        video:
          "aksh-evening.1.mov"
      },

      {
        start: 17.75,
        end: 19,
        greeting: "Good Evening",
        period: "EVENING",
        quote:
          "It is okay to slow down and simply exist.",
        video:
          "aksh-evening.2.mov"
      },

      {
        start: 19,
        end: 20,
        greeting: "Good Evening",
        period: "EVENING",
        quote:
          "Look a little further. There is always another horizon.",
        video:
          "aksh-evening.3.mov"
      },

      /* NIGHT */

      {
        start: 20,
        end: 24,
        greeting: "Good Night",
        period: "NIGHT",
        quote:
          "You are safe to rest. Tomorrow can wait.",
        video:
          "aksh-night.1.mov"
      }

    ];


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const video =
      document.getElementById("backgroundVideo");

    const loader =
      document.getElementById("loader");

    const dateElement =
      document.getElementById("date");

    const greetingElement =
      document.getElementById("greeting");

    const quoteElement =
      document.getElementById("quote");

    const periodElement =
      document.getElementById("period");

    const soundButton =
      document.getElementById("soundButton");

    const beginButton =
      document.getElementById("beginButton");

    const transition =
      document.getElementById("transition");


    let currentVideo = "";

    let audioAttempted = false;


    /* =========================================================
       LOCAL TIME
    ========================================================= */

    function getLocalHour() {

      const now = new Date();

      return (
        now.getHours() +
        now.getMinutes() / 60 +
        now.getSeconds() / 3600
      );

    }


    /* =========================================================
       CURRENT EXPERIENCE
    ========================================================= */

    function getCurrentExperience() {

      const hour = getLocalHour();

      return schedule.find(
        item =>
          hour >= item.start &&
          hour < item.end
      );

    }


    /* =========================================================
       DATE
    ========================================================= */

    function updateDate() {

      const now = new Date();

      const formatted =
        new Intl.DateTimeFormat(
          undefined,
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        ).format(now);

      dateElement.textContent =
        formatted;

    }


    /* =========================================================
       LOAD VIDEO
    ========================================================= */

    function loadExperience() {

      const experience =
        getCurrentExperience();

      if (!experience) {
        return;
      }

      greetingElement.textContent =
        experience.greeting;

      quoteElement.textContent =
        experience.quote;

      periodElement.textContent =
        `AKSH · ${experience.period}`;


      /*
       * Don't reload the same video every second.
       */

      if (
        currentVideo ===
        experience.video
      ) {
        return;
      }


      currentVideo =
        experience.video;


      video.classList.remove(
        "visible"
      );


      video.pause();


      video.src =
        experience.video;


      video.load();


      video.addEventListener(
        "loadeddata",
        function handleLoaded() {

          video.classList.add(
            "visible"
          );

          loader.classList.add(
            "hidden"
          );


          /*
           * First try:
           * autoplay WITH sound.
           */

          attemptAudioPlayback();


          /*
           * If Safari blocks audio,
           * fall back to muted autoplay.
           */

          video.play().catch(
            () => {

              video.muted = true;

              video.play().catch(
                () => {}
              );

            }
          );

        },
        {
          once: true
        }
      );


      video.addEventListener(
        "error",
        function handleError() {

          loader.classList.add(
            "hidden"
          );

        },
        {
          once: true
        }
      );

    }


    /* =========================================================
       AUTOMATIC SOUND ATTEMPT
    ========================================================= */

    function attemptAudioPlayback() {

      if (audioAttempted) {
        return;
      }

      audioAttempted = true;


      /*
       * Videos contain their own music.
       *
       * Safari may reject this because audio
       * autoplay normally requires user interaction.
       */

      video.muted = false;


      const promise =
        video.play();


      if (promise !== undefined) {

        promise.catch(
          () => {

            /*
             * Browser blocked autoplay audio.
             *
             * We keep video playback working
             * and wait for the visitor's first
             * interaction.
             */

            video.muted = true;

          }
        );

      }

    }


    /* =========================================================
       SOUND BUTTON
    ========================================================= */

    function setSoundIcon(
      enabled
    ) {

      if (enabled) {

        soundButton.innerHTML = `
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
            <path d="M17 8.5c1.9 1.9 1.9 5.1 0 7"></path>
            <path d="M19.5 6c3.2 3.2 3.2 8.8 0 12"></path>
          </svg>
        `;

        soundButton.setAttribute(
          "aria-label",
          "Mute sound"
        );

      } else {

        soundButton.innerHTML = `
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
            <path d="m18 9-4 6"></path>
            <path d="m14 9 4 6"></path>
          </svg>
        `;

        soundButton.setAttribute(
          "aria-label",
          "Turn sound on"
        );

      }

    }


    soundButton.addEventListener(
      "click",
      () => {

        if (video.muted) {

          video.muted = false;

          video.play().catch(
            () => {}
          );

          setSoundIcon(true);

        } else {

          video.muted = true;

          setSoundIcon(false);

        }

      }
    );


    /* =========================================================
       FIRST USER INTERACTION
       Helps Safari unlock video audio.
    ========================================================= */

    function unlockAudio() {

      if (!video.src) {
        return;
      }

      if (
        video.muted
      ) {

        video.muted = false;

        video.play().catch(
          () => {}
        );

        setSoundIcon(true);

      }

    }


    document.addEventListener(
      "touchstart",
      unlockAudio,
      {
        once: true,
        passive: true
      }
    );


    document.addEventListener(
      "click",
      unlockAudio,
      {
        once: true
      }
    );


    /* =========================================================
       BEGIN JOURNEY
    ========================================================= */

    beginButton.addEventListener(
      "click",
      () => {

        transition.classList.add(
          "active"
        );


        /*
         * Stage 1 homepage will be
         * connected here after it is built.
         */

        setTimeout(
          () => {

            transition.classList.remove(
              "active"
            );

          },
          900
        );

      }
    );


    /* =========================================================
       KEEP TIME UPDATED
    ========================================================= */

    setInterval(
      () => {

        updateDate();

        loadExperience();

      },
      1000
    );


    /* =========================================================
       START
    ========================================================= */

    updateDate();

    setSoundIcon(false);

    loadExperience();

  </script>

</body>
</html>
