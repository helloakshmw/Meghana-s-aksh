<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#11100f"
    >

    <meta
        name="description"
        content="AKSH Mental Wellness — A Safe Space For Every Mind."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>AKSH — A Safe Space For Every Mind</title>

    <link
        rel="icon"
        type="image/png"
        href="aksh-icon.PNG"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Parisienne&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="script.js"
        defer
    ></script>

</head>


<body>

    <!-- =====================================================
         BACKGROUND VIDEO
    ====================================================== -->

    <video
        id="backgroundVideo"
        class="background-video"
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
    ></video>


    <!-- =====================================================
         VIDEO OVERLAY
    ====================================================== -->

    <div
        class="video-overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         PAGE TRANSITION
    ====================================================== -->

    <div
        id="pageTransition"
        class="page-transition"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         TOP LEFT — DATE / DAY
    ====================================================== -->

    <div
        class="arrival-date"
        aria-label="Current date"
    >

        <span
            id="arrivalDate"
            class="arrival-date-number"
        >
            00.00.0000
        </span>

        <span
            id="arrivalDay"
            class="arrival-day"
        >
            Day
        </span>

    </div>


    <!-- =====================================================
         TOP CENTER — AKSH BRAND
    ====================================================== -->

    <a
        href="index.html"
        class="arrival-brand"
        aria-label="AKSH Mental Wellness"
    >

        <img
            src="aksh-icon.PNG"
            alt="AKSH"
            class="arrival-brand-icon"
        >

        <span class="arrival-brand-name">
            AKSH
        </span>

        <span class="arrival-brand-tagline">
            A Safe Space For Every Mind
        </span>

    </a>


    <!-- =====================================================
         TOP RIGHT — MENU
    ====================================================== -->

    <button
        id="menuButton"
        class="menu-button"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="arrivalNavigation"
    >

        <span
            class="menu-line menu-line-one"
            aria-hidden="true"
        ></span>

        <span
            class="menu-line menu-line-two"
            aria-hidden="true"
        ></span>

    </button>


    <!-- =====================================================
         MAIN ARRIVAL CONTENT
    ====================================================== -->

    <main class="arrival-main">

        <section
            class="arrival-content"
            aria-labelledby="timeGreeting"
        >

            <p
                id="timeGreeting"
                class="time-greeting"
            >
                Good Evening
            </p>


            <p
                id="arrivalMessage"
                class="arrival-message"
            >
                Let the day become quieter.
                Give yourself a moment.
            </p>


            <button
                id="beginButton"
                class="begin-button"
                type="button"
            >

                <span class="begin-button-text">
                    Begin Your Journey
                </span>

                <span
                    class="begin-button-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </button>

        </section>

    </main>


    <!-- =====================================================
         BOTTOM LEFT — SOUND
    ====================================================== -->

    <button
        id="soundButton"
        class="sound-button"
        type="button"
        aria-label="Enable sound"
        aria-pressed="false"
    >

        <span
            class="sound-icon"
            aria-hidden="true"
        ></span>

        <span
            data-sound-text
            class="sound-text"
        >
            Sound Off
        </span>

    </button>


    <!-- =====================================================
         BOTTOM CENTER — VIDEO PROGRESS
    ====================================================== -->

    <div
        class="video-progress"
        aria-hidden="true"
    >

        <div
            id="videoProgressBar"
            class="video-progress-bar"
        ></div>

    </div>


    <!-- =====================================================
         MEGHANA KAVERAPPA
    ====================================================== -->

    <a
        href="meghana-kaverappa.html"
        class="meghana-arrival"
        aria-label="Meet Meghana Kaverappa"
    >

        <span class="meghana-name">
            Meghana Kaverappa
        </span>

        <img
            src="meghana.kaverappa.PNG"
            alt="Meghana Kaverappa"
            class="meghana-photo"
        >

    </a>


    <!-- =====================================================
         FULLSCREEN NAVIGATION
    ====================================================== -->

    <aside
        id="arrivalNavigation"
        class="arrival-navigation"
        aria-hidden="true"
    >

        <button
            id="closeMenuButton"
            class="close-menu-button"
            type="button"
            aria-label="Close navigation"
        ></button>


        <div class="navigation-inner">

            <p class="navigation-caption">
                Explore AKSH
            </p>


            <nav
                class="navigation-links"
                aria-label="Main navigation"
            >

                <a href="aksh.html">
                    <span>01</span>
                    The World
                </a>

                <a href="the-mind.html">
                    <span>02</span>
                    The Mind
                </a>

                <a href="with-you.html">
                    <span>03</span>
                    With You
                </a>

                <a href="meghana-kaverappa.html">
                    <span>04</span>
                    Meghana
                </a>

                <a href="journey.html">
                    <span>05</span>
                    Journey
                </a>

                <a href="stories.html">
                    <span>06</span>
                    Stories
                </a>

                <a href="journal.html">
                    <span>07</span>
                    Journal
                </a>

                <a href="ai.html">
                    <span>08</span>
                    AKSH AI
                </a>

                <a href="booking.html">
                    <span>09</span>
                    Book a Session
                </a>

            </nav>

        </div>

    </aside>

</body>

</html>
