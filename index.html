<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="AKSH — A Safe Space for Every Mind."
    >

    <meta name="theme-color" content="#0b0b0d">

    <title>AKSH — A Safe Space for Every Mind</title>

    <!-- Premium free fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         AKSH — 00 ARRIVAL
         ===================================================== -->

    <main id="arrival" class="arrival">

        <!-- Background video -->
        <video
            id="backgroundVideo"
            class="background-video"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto"
            aria-hidden="true"
        ></video>

        <!-- Cinematic atmospheric layers -->
        <div class="atmosphere" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <!-- Top controls -->
        <header class="top-bar">

            <button
                id="soundToggle"
                class="sound-toggle"
                type="button"
                aria-label="Turn sound on"
                aria-pressed="false"
            >
                <span class="sound-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span id="soundLabel">SOUND OFF</span>
            </button>

        </header>

        <!-- Main Arrival content -->
        <section
            class="arrival-content"
            aria-labelledby="brandName"
        >

            <!-- AKSH identity -->
            <div class="brand">

                <img
                    id="akshIcon"
                    class="aksh-icon"
                    src="aksh-icon.PNG"
                    alt="AKSH"
                >

                <p class="brand-name" id="brandName">
                    AKSH
                </p>

                <p class="tagline">
                    A Safe Space for Every Mind
                </p>

            </div>

            <!-- Time greeting -->
            <div class="greeting-area">

                <p
                    id="timeDisplay"
                    class="time-display"
                    aria-live="polite"
                ></p>

                <h1
                    id="greeting"
                    class="greeting"
                    aria-live="polite"
                ></h1>

                <p
                    id="reflection"
                    class="reflection"
                    aria-live="polite"
                ></p>

            </div>

            <!-- Begin -->
            <div class="begin-area">

                <button
                    id="beginButton"
                    class="begin-button"
                    type="button"
                >
                    <span>Begin Your Journey</span>

                    <span
                        class="begin-arrow"
                        aria-hidden="true"
                    >
                        →
                    </span>
                </button>

            </div>

        </section>

        <!-- Bottom information -->
        <footer class="arrival-footer">

            <span>00</span>

            <span class="footer-line"></span>

            <span>ARRIVAL</span>

        </footer>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
