<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#09090b"
    >

    <meta
        name="description"
        content="AKSH — A Safe Space for Every Mind."
    >

    <title>AKSH — A Safe Space for Every Mind</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main
        class="arrival"
        id="arrival"
        aria-label="AKSH"
    >

        <!-- ==================================================
             BACKGROUND VIDEO
             ================================================== -->

        <video
            id="backgroundVideo"
            class="background-video"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto"
            aria-hidden="true"
        ></video>


        <!-- ==================================================
             ATMOSPHERE
             ================================================== -->

        <div
            class="atmosphere"
            id="atmosphere"
            aria-hidden="true"
        ></div>

        <div
            class="vignette"
            aria-hidden="true"
        ></div>

        <div
            class="grain"
            aria-hidden="true"
        ></div>


        <!-- ==================================================
             SOUND
             ================================================== -->

        <div class="top-bar">

            <button
                class="sound-toggle"
                id="soundToggle"
                type="button"
                aria-label="Turn sound on"
                aria-pressed="false"
            >

                <span
                    class="sound-icon"
                    aria-hidden="true"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span id="soundLabel">
                    SOUND OFF
                </span>

            </button>

        </div>


        <!-- ==================================================
             MAIN ARRIVAL CONTENT
             ================================================== -->

        <section class="arrival-content">

            <!-- BRAND -->

            <div class="brand">

                <img
                    id="akshIcon"
                    class="aksh-icon"
                    src="aksh-icon.PNG"
                    alt="AKSH"
                    draggable="false"
                >

                <p class="brand-name">
                    AKSH
                </p>

                <p class="tagline">
                    A Safe Space for Every Mind
                </p>

            </div>


            <!-- GREETING -->

            <div class="greeting-area">

                <div
                    class="time-display"
                    id="timeDisplay"
                    aria-live="polite"
                ></div>

                <h1
                    class="greeting"
                    id="greeting"
                >
                    Good Morning
                </h1>

                <p
                    class="reflection"
                    id="reflection"
                ></p>

            </div>


            <!-- BEGIN -->

            <div class="begin-area">

                <button
                    class="begin-button"
                    id="beginButton"
                    type="button"
                >

                    <span class="begin-text">
                        Begin Your Journey
                    </span>

                    <span
                        class="begin-arrow"
                        aria-hidden="true"
                    >
                        →
                    </span>

                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
