<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>AKSH — A Safe Space For Every Mind</title>

  <meta
    name="description"
    content="AKSH — A Safe Space For Every Mind. A welcoming space for mental wellness, emotional support, self-exploration and human connection."
  />

  <meta name="theme-color" content="#10100f" />

  <meta property="og:title" content="AKSH — A Safe Space For Every Mind" />
  <meta
    property="og:description"
    content="A Safe Space For Every Mind."
  />
  <meta property="og:type" content="website" />

  <style>
    :root {
      --text: #f7f4ee;
      --muted: rgba(247, 244, 238, 0.72);
      --line: rgba(255, 255, 255, 0.24);
      --overlay: rgba(0, 0, 0, 0.32);
      --overlay-strong: rgba(0, 0, 0, 0.52);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10100f;
    }

    body {
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
    }

    .arrival {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      background: #10100f;
    }

    /* --------------------------------------------------
       VIDEO LAYER
    -------------------------------------------------- */

    .video-layer {
      position: absolute;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      background: #10100f;
    }

    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transform: scale(1.035);
      transition:
        opacity 1.2s ease,
        transform 8s ease;
      will-change: opacity, transform;
    }

    .background-video.is-visible {
      opacity: 1;
      transform: scale(1);
    }

    .video-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.34) 0%,
          rgba(0, 0, 0, 0.08) 25%,
          rgba(0, 0, 0, 0.08) 55%,
          rgba(0, 0, 0, 0.42) 100%
        );
    }

    .video-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          circle at center,
          transparent 20%,
          rgba(0, 0, 0, 0.13) 72%,
          rgba(0, 0, 0, 0.38) 100%
        );
    }

    /* --------------------------------------------------
       MAIN CONTENT
    -------------------------------------------------- */

    .arrival-content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }

    /* --------------------------------------------------
       TOP BAR
    -------------------------------------------------- */

    .top-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 20px;
    }

    .date-block {
      justify-self: start;
      padding-top: 2px;
    }

    .date {
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 500;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--text);
      white-space: nowrap;
    }

    .brand {
      position: relative;
      justify-self: center;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-watermark {
      position: absolute;
      top: -19px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(50px, 7vw, 100px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.075);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .brand-icon {
      position: relative;
      width: clamp(34px, 4vw, 48px);
      height: clamp(34px, 4vw, 48px);
      object-fit: contain;
      z-index: 2;
      filter:
        brightness(0)
        invert(1);
      opacity: 0.96;
    }

    .brand-name {
      position: relative;
      margin-top: 9px;
      font-size: clamp(9px, 0.9vw, 12px);
      letter-spacing: 0.36em;
      padding-left: 0.36em;
      font-weight: 500;
      z-index: 2;
    }

    .brand-tagline {
      margin-top: 6px;
      font-size: clamp(8px, 0.75vw, 10px);
      letter-spacing: 0.12em;
      color: var(--muted);
      white-space: nowrap;
    }

    .top-controls {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.12);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease;
    }

    .control-button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .control-button:active {
      transform: scale(0.96);
    }

    .control-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* --------------------------------------------------
       CENTRE
    -------------------------------------------------- */

    .hero-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 10px;
    }

    .greeting {
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      font-size: clamp(48px, 9vw, 112px);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: -0.035em;
      text-shadow: 0 8px 35px rgba(0, 0, 0, 0.2);
      animation: greetingIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .quote {
      max-width: 560px;
      margin-top: 25px;
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      font-size: clamp(16px, 1.8vw, 22px);
      line-height: 1.5;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 5px 25px rgba(0, 0, 0, 0.28);
      animation: quoteIn 1.4s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .time-state {
      margin-top: 18px;
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      padding-left: 0.3em;
      animation: quoteIn 1.4s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* --------------------------------------------------
       BOTTOM
    -------------------------------------------------- */

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 70px;
    }

    .begin-button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.58);
      background: rgba(0, 0, 0, 0.16);
      color: var(--text);
      min-width: 210px;
      min-height: 52px;
      padding: 0 30px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding-left: calc(30px + 0.22em);
      transition:
        background 0.35s ease,
        border-color 0.35s ease,
        transform 0.35s ease,
        box-shadow 0.35s ease;
      animation: buttonIn 1.5s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .begin-button:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    }

    .begin-button:active {
      transform: scale(0.98);
    }

    .begin-arrow {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }

    .begin-arrow svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.35s ease;
    }

    .begin-button:hover .begin-arrow svg {
      transform: translateX(4px);
    }

    .skip-button {
      position: absolute;
      right: 0;
      bottom: 13px;
      appearance: none;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 10px;
      padding-left: calc(10px + 0.22em);
      transition:
        color 0.25s ease,
        opacity 0.25s ease;
    }

    .skip-button:hover {
      color: #fff;
    }

    /* --------------------------------------------------
       LOADING
    -------------------------------------------------- */

    .loader {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #10100f;
      transition:
        opacity 0.9s ease,
        visibility 0.9s ease;
    }

    .loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .loader-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter:
        brightness(0)
        invert(1);
      opacity: 0.9;
      animation: breathe 2s ease-in-out infinite;
    }

    .loader-line {
      width: 90px;
      height: 1px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.15);
    }

    .loader-progress {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.75);
      transform: translateX(-100%);
      animation: loading 1.4s ease-in-out infinite;
    }

    /* --------------------------------------------------
       TRANSITION
    -------------------------------------------------- */

    .page-transition {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: #10100f;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    .page-transition.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    /* --------------------------------------------------
       ANIMATIONS
    -------------------------------------------------- */

    @keyframes greetingIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes quoteIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(100%);
      }
    }

    @keyframes breathe {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.65;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* --------------------------------------------------
       TABLET
    -------------------------------------------------- */

    @media (max-width: 768px) {
      .arrival-content {
        padding:
          max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(22px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      .top-bar {
        grid-template-columns: 1fr auto;
      }

      .brand {
        grid-column: 1 / -1;
        grid-row: 1;
        margin-bottom: 14px;
      }

      .date-block {
        grid-column: 1;
        grid-row: 2;
        align-self: center;
      }

      .top-controls {
        grid-column: 2;
        grid-row: 2;
      }

      .brand-watermark {
        top: -12px;
        font-size: 60px;
      }

      .brand-tagline {
        font-size: 8px;
      }

      .hero-center {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .greeting {
        font-size: clamp(48px, 15vw, 82px);
      }

      .quote {
        max-width: 340px;
        font-size: 16px;
        margin-top: 20px;
      }

      .skip-button {
        right: -5px;
        bottom: 3px;
      }

      .background-video {
        object-position: center;
      }
    }

    /* --------------------------------------------------
       SMALL PHONES
    -------------------------------------------------- */

    @media (max-width: 390px) {
      .arrival-content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
      }

      .brand-name {
        margin-top: 6px;
        font-size: 8px;
      }

      .brand-tagline {
        display: none;
      }

      .date {
        font-size: 9px;
      }

      .control-button {
        width: 34px;
        height: 34px;
      }

      .greeting {
        font-size: 48px;
      }

      .quote {
        font-size: 15px;
        max-width: 300px;
      }

      .begin-button {
        min-width: 190px;
        min-height: 48px;
        font-size: 9px;
      }
    }

    /* --------------------------------------------------
       REDUCED MOTION
    -------------------------------------------------- */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .background-video {
        transform: none;
      }
    }

    /* --------------------------------------------------
       LANDSCAPE MOBILE
    -------------------------------------------------- */

    @media (max-height: 520px) and (orientation: landscape) {
      .arrival-content {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .top-bar {
        grid-template-columns: 1fr auto 1fr;
      }

      .brand {
        grid-column: auto;
        grid-row: auto;
        margin-bottom: 0;
      }

      .date-block {
        grid-column: auto;
        grid-row: auto;
      }

      .top-controls {
        grid-column: auto;
        grid-row: auto;
      }

      .brand-icon {
        width: 28px;
        height: 28px;
      }

      .brand-name {
        margin-top: 3px;
      }

      .brand-tagline {
        display: none;
      }

      .hero-center {
        padding: 10px;
      }

      .greeting {
        font-size: clamp(38px, 9vw, 60px);
      }

      .quote {
        margin-top: 10px;
        font-size: 13px;
      }

      .time-state {
        margin-top: 8px;
      }

      .bottom-bar {
        min-height: 52px;
      }

      .begin-button {
        min-height: 42px;
      }
    }
  </style>
</head>

<body>

  <main class="arrival" id="arrival">

    <!-- BACKGROUND VIDEO -->
    <div class="video-layer" aria-hidden="true">
      <video
        id="backgroundVideo"
        class="background-video"
        muted
        autoplay
        playsinline
        preload="auto"
      ></video>

      <div class="video-tint"></div>
      <div class="video-vignette"></div>
    </div>

    <!-- LOADING SCREEN -->
    <div class="loader" id="loader">
      <div class="loader-inner">
        <img
          class="loader-icon"
          src="aksh-icon.PNG"
          alt=""
        />

        <div class="loader-line">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>

    <!-- PAGE CONTENT -->
    <div class="arrival-content">

      <!-- TOP -->
      <header class="top-bar">

        <div class="date-block">
          <div class="date" id="dateDisplay"></div>
        </div>

        <div class="brand">

          <div class="brand-watermark" aria-hidden="true">
            AKSH
          </div>

          <img
            class="brand-icon"
            src="aksh-icon.PNG"
            alt="AKSH"
          />

          <div class="brand-name">
            AKSH
          </div>

          <div class="brand-tagline">
            A SAFE SPACE FOR EVERY MIND
          </div>

        </div>

        <div class="top-controls">

          <button
            class="control-button"
            id="soundButton"
            type="button"
            aria-label="Sound is muted"
            title="Sound"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
              <path d="m18 9-4 6"></path>
              <path d="m14 9 4 6"></path>
            </svg>
          </button>

        </div>

      </header>

      <!-- CENTRE -->
      <section class="hero-center">

        <h1 class="greeting" id="greeting">
          Welcome
        </h1>

        <p class="quote" id="quote">
          Take a moment. You are welcome here.
        </p>

        <div class="time-state" id="timeState">
          AKSH
        </div>

      </section>

      <!-- BOTTOM -->
      <footer class="bottom-bar">

        <button
          class="begin-button"
          id="beginButton"
          type="button"
        >
          <span>Begin Your Journey</span>

          <span class="begin-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 12h13"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </span>
        </button>

        <button
          class="skip-button"
          id="skipButton"
          type="button"
        >
          Skip
        </button>

      </footer>

    </div>

    <!-- TRANSITION -->
    <div
      class="page-transition"
      id="pageTransition"
      aria-hidden="true"
    ></div>

  </main>

  <script>
    /*
     * =========================================================
     * AKSH — STAGE 0 / ARRIVAL EXPERIENCE
     * =========================================================
     *
     * Time schedule:
     *
     * 05:00–06:00  Morning 1
     * 06:00–08:00  Morning 2
     * 08:00–10:00  Morning 3
     * 10:00–12:00  Morning 4
     *
     * 12:00–13:00  Afternoon 1
     * 13:00–14:30  Afternoon 2
     * 14:30–16:00  Afternoon 3
     * 16:00–17:00  Afternoon 4
     *
     * 17:00–17:45  Evening 1
     * 17:45–19:00  Evening 2
     * 19:00–20:00  Evening 3
     *
     * 20:00–00:00  Night 1
     * 00:00–05:00  Night 2
     */

    const VIDEO_SCHEDULE = [
      {
        start: 0,
        end: 5,
        greeting: "Good Night",
        state: "NIGHT",
        quote: "Let the world become quiet. You can simply be.",
        video: "aksh-night.2.mov"
      },
      {
        start: 5,
        end: 6,
        greeting: "Good Morning",
        state: "MORNING",
        quote: "Begin gently. There is nowhere you need to rush.",
        video: "aksh-morning.1.mov"
      },
      {
        start: 6,
        end: 8,
        greeting: "Good Morning",
        state: "MORNING",
        quote: "A new day does not ask you to have everything figured out.",
        video: "aksh-morning.2.mov"
      },
      {
        start: 8,
        end: 10,
        greeting: "Good Morning",
        state: "MORNING",
        quote: "Take a breath. Let this moment be enough.",
        video: "aksh-morning.3.mov"
      },
      {
        start: 10,
        end: 12,
        greeting: "Good Morning",
        state: "MORNING",
        quote: "There is space here for whatever today brings.",
        video: "aksh-morning.4.mov"
      },
      {
        start: 12,
        end: 13,
        greeting: "Good Afternoon",
        state: "AFTERNOON",
        quote: "Pause for a moment. You deserve a little space.",
        video: "aksh-afternoon.1.mov"
      },
      {
        start: 13,
        end: 14.5,
        greeting: "Good Afternoon",
        state: "AFTERNOON",
        quote: "Warm light. A quiet moment. Just be here.",
        video: "aksh-afternoon.2.mov"
      },
      {
        start: 14.5,
        end: 16,
        greeting: "Good Afternoon",
        state: "AFTERNOON",
        quote: "You do not have to carry everything at once.",
        video: "aksh-afternoon.3.mov"
      },
      {
        start: 16,
        end: 17,
        greeting: "Good Afternoon",
        state: "AFTERNOON",
        quote: "Even changing skies can hold a little hope.",
        video: "aksh-afternoon.4.mov"
      },
      {
        start: 17,
        end: 17.75,
        greeting: "Good Evening",
        state: "EVENING",
        quote: "Some beautiful moments arrive when we least expect them.",
        video: "aksh-evening.1.mov"
      },
      {
        start: 17.75,
        end: 19,
        greeting: "Good Evening",
        state: "EVENING",
        quote: "It is okay to slow down and simply exist.",
        video: "aksh-evening.2.mov"
      },
      {
        start: 19,
        end: 20,
        greeting: "Good Evening",
        state: "EVENING",
        quote: "Look a little further. There is always another horizon.",
        video: "aksh-evening.3.mov"
      },
      {
        start: 20,
        end: 24,
        greeting: "Good Night",
        state: "NIGHT",
        quote: "You are safe to rest. Tomorrow can wait.",
        video: "aksh-night.1.mov"
      }
    ];

    const video = document.getElementById("backgroundVideo");
    const loader = document.getElementById("loader");
    const greeting = document.getElementById("greeting");
    const quote = document.getElementById("quote");
    const timeState = document.getElementById("timeState");
    const dateDisplay = document.getElementById("dateDisplay");
    const beginButton = document.getElementById("beginButton");
    const skipButton = document.getElementById("skipButton");
    const soundButton = document.getElementById("soundButton");
    const pageTransition = document.getElementById("pageTransition");

    let currentScheduleIndex = -1;
    let soundEnabled = false;
    let transitionStarted = false;

    /*
     * Convert the visitor's current local time into decimal hours.
     */
    function getLocalDecimalHour() {
      const now = new Date();

      return (
        now.getHours() +
        now.getMinutes() / 60 +
        now.getSeconds() / 3600
      );
    }

    /*
     * Find the correct video based on local visitor time.
     */
    function getScheduleIndex() {
      const hour = getLocalDecimalHour();

      return VIDEO_SCHEDULE.findIndex(
        item => hour >= item.start && hour < item.end
      );
    }

    /*
     * Update the date automatically.
     */
    function updateDate() {
      const now = new Date();

      const formatted = new Intl.DateTimeFormat(
        undefined,
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      ).format(now);

      dateDisplay.textContent = formatted;
    }

    /*
     * Update the central experience.
     */
    function updateExperience(force = false) {
      const index = getScheduleIndex();

      if (index === -1) {
        return;
      }

      if (!force && index === currentScheduleIndex) {
        return;
      }

      currentScheduleIndex = index;

      const current = VIDEO_SCHEDULE[index];

      greeting.textContent = current.greeting;
      quote.textContent = current.quote;
      timeState.textContent = `AKSH · ${current.state}`;

      loadVideo(current.video);
    }

    /*
     * Load a video safely.
     */
    function loadVideo(filename) {
      const source = filename;

      video.classList.remove("is-visible");

      video.pause();

      const handleLoaded = () => {
        video.classList.add("is-visible");

        video.play().catch(() => {
          /*
           * Mobile browsers may block autoplay.
           * The visual experience still works and the user
           * can enable sound manually.
           */
        });

        setTimeout(() => {
          loader.classList.add("is-hidden");
        }, 350);
      };

      video.addEventListener(
        "loadeddata",
        handleLoaded,
        { once: true }
      );

      video.addEventListener(
        "error",
        () => {
          loader.classList.add("is-hidden");
          video.classList.add("is-visible");
        },
        { once: true }
      );

      video.src = source;
      video.load();
    }

    /*
     * Sound control.
     *
     * Videos begin muted because modern mobile browsers
     * generally require user interaction before sound.
     */
    function updateSoundButton() {
      if (soundEnabled) {
        video.muted = false;

        soundButton.setAttribute(
          "aria-label",
          "Mute sound"
        );

        soundButton.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
            <path d="M17 8.5c1.9 1.9 1.9 5.1 0 7"></path>
            <path d="M19.5 6c3.2 3.2 3.2 8.8 0 12"></path>
          </svg>
        `;
      } else {
        video.muted = true;

        soundButton.setAttribute(
          "aria-label",
          "Turn sound on"
        );

        soundButton.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
            <path d="m18 9-4 6"></path>
            <path d="m14 9 4 6"></path>
          </svg>
        `;
      }
    }

    soundButton.addEventListener("click", () => {
      soundEnabled = !soundEnabled;

      updateSoundButton();

      if (soundEnabled) {
        video.play().catch(() => {});
      }
    });

    /*
     * Enter the main AKSH experience.
     *
     * Stage 1 will eventually replace this destination.
     * For now, the transition is intentionally prepared
     * without inventing a non-existent page.
     */
    function beginJourney() {
      if (transitionStarted) {
        return;
      }

      transitionStarted = true;

      pageTransition.classList.add("is-active");

      setTimeout(() => {
        /*
         * Stage 1 homepage will be connected here.
         *
         * We deliberately do not send the visitor to a
         * missing URL during Stage 0.
         */
        pageTransition.classList.remove("is-active");

        transitionStarted = false;
      }, 900);
    }

    beginButton.addEventListener(
      "click",
      beginJourney
    );

    /*
     * Skip removes the intro experience and prepares
     * immediate entry into the main experience.
     */
    skipButton.addEventListener(
      "click",
      beginJourney
    );

    /*
     * Keep the date accurate if the page remains open
     * around midnight.
     */
    setInterval(() => {
      updateDate();
      updateExperience();
    }, 1000);

    /*
     * Initialisation.
     */
    updateDate();
    updateSoundButton();
    updateExperience(true);
  </script>

</body>
</html>
