<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="description"
        content="AKSH — A Safe Space for Every Mind."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>AKSH — A Safe Space for Every Mind</title>


    <!-- =================================================
         FAVICON
    ================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="aksh-icon.PNG"
    >


    <!-- =================================================
         PRECONNECT
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <!-- =================================================
         FONTS
    ================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         ARRIVAL PAGE
    ================================================== -->

    <main
        id="arrival"
        aria-label="AKSH arrival experience"
    >


        <!-- =============================================
             BACKGROUND VIDEO
        ============================================== -->

        <video
            id="backgroundVideo"
            autoplay
            muted
            playsinline
            webkit-playsinline
            preload="auto"
            aria-hidden="true"
        ></video>


        <!-- =============================================
             GRAIN
        ============================================== -->

        <div
            id="grain"
            aria-hidden="true"
        ></div>


        <!-- =============================================
             TOP BAR
        ============================================== -->

        <header class="arrival-top">


            <!-- AKSH ICON -->

            <a
                href="index.html"
                class="arrival-brand"
                aria-label="AKSH Home"
            >

                <img
                    src="aksh-icon.PNG"
                    alt="AKSH"
                >

            </a>


            <!-- MENU -->

            <button
                id="menuButton"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
                aria-controls="arrivalNavigation"
            >

                <span
                    class="menu-lines"
                    aria-hidden="true"
                >

                    <span></span>
                    <span></span>

                </span>

            </button>

        </header>


        <!-- =============================================
             ARRIVAL CONTENT
        ============================================== -->

        <section
            class="arrival-content"
            aria-label="AKSH introduction"
        >


            <!-- AKSH CENTRAL ICON -->

            <div
                class="arrival-mark"
                aria-hidden="true"
            >

                <img
                    src="aksh-icon.PNG"
                    alt=""
                >

            </div>


            <!-- GREETING -->

            <h1 id="timeGreeting">
                Good Evening
            </h1>


            <!-- MESSAGE -->

            <p id="arrivalMessage">
                Take a breath. You are here.
            </p>


            <!-- DATE + DAY -->

            <div
                class="arrival-date"
                aria-label="Current date"
            >

                <span id="currentDate">
                    14.08.2026
                </span>


                <span
                    class="arrival-date-separator"
                    aria-hidden="true"
                ></span>


                <span id="currentDay">
                    Friday
                </span>

            </div>


            <!-- BEGIN -->

            <button
                id="beginButton"
                type="button"
            >

                Begin Your Journey

            </button>

        </section>


        <!-- =============================================
             BOTTOM CONTROLS
        ============================================== -->

        <div class="arrival-bottom">


            <!-- SOUND -->

            <button
                id="soundButton"
                type="button"
                aria-label="Turn sound on"
                aria-pressed="false"
            >

                <span
                    class="sound-icon"
                    aria-hidden="true"
                ></span>

                <span id="soundText">
                    Sound Off
                </span>

            </button>


            <!-- VIDEO INFO -->

            <div class="video-info">

                <span
                    id="videoIndicator"
                    aria-label="Current arrival video"
                >
                    01 / 13
                </span>


                <div
                    class="video-progress"
                    aria-hidden="true"
                >

                    <div
                        id="videoProgressBar"
                    ></div>

                </div>

            </div>

        </div>


    </main>


    <!-- =================================================
         FULL SCREEN NAVIGATION
    ================================================== -->

    <aside
        id="arrivalNavigation"
        aria-hidden="true"
    >


        <!-- CLOSE -->

        <button
            id="closeMenuButton"
            type="button"
            aria-label="Close navigation"
        >

            <span
                class="close-icon"
                aria-hidden="true"
            ></span>

        </button>


        <div class="navigation-inner">


            <div
                class="navigation-heading"
                aria-hidden="true"
            >
                Explore AKSH.
            </div>


            <nav
                class="navigation-links"
                aria-label="Main navigation"
            >

                <a href="aksh.html">
                    The World
                </a>

                <a href="the-mind.html">
                    The Mind
                </a>

                <a href="with-you.html">
                    With You
                </a>

                <a href="meghana-kaverappa.html">
                    Meghana
                </a>

                <a href="journey.html">
                    Journey
                </a>

                <a href="stories.html">
                    Stories
                </a>

                <a href="journal.html">
                    Journal
                </a>

                <a href="ai.html">
                    AKSH AI
                </a>

                <a href="booking.html">
                    Book
                </a>

            </nav>


        </div>

    </aside>


    <!-- =================================================
         PAGE TRANSITION
    ================================================== -->

    <div
        id="pageTransition"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        src="script.js"
        defer
    ></script>


</body>

</html>
