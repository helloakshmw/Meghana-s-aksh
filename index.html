<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>AKSH — A Safe Space For Every Mind</title>

  <meta
    name="description"
    content="AKSH — A Safe Space For Every Mind."
  />

  <meta name="theme-color" content="#11100f" />

  <style>
    :root {
      --white: #ffffff;
      --soft-white: rgba(255, 255, 255, 0.92);
      --muted-white: rgba(255, 255, 255, 0.68);
      --line: rgba(255, 255, 255, 0.32);
      --dark: #11100f;
      --overlay: rgba(0, 0, 0, 0.24);
      --button-bg: rgba(255, 255, 255, 0.12);
      --button-border: rgba(255, 255, 255, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       FULL-SCREEN VIDEO
    ========================================================= */

    .experience {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #11100f;
    }

    .video-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #11100f;
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      opacity: 0;
      transform: scale(1.015);

      transition:
        opacity 1.15s ease,
        transform 6s ease;

      filter: saturate(0.94) contrast(0.98);
    }

    #backgroundVideo.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* =========================================================
       CINEMATIC OVERLAY
    ========================================================= */

    .cinematic-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.22) 0%,
          rgba(0, 0, 0, 0.04) 27%,
          rgba(0, 0, 0, 0.03) 55%,
          rgba(0, 0, 0, 0.22) 100%
        );

      transition:
        background 1.2s ease,
        opacity 1.2s ease;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      opacity: 0.035;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");

      mix-blend-mode: soft-light;
    }

    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    .content {
      position: relative;
      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      padding:
        max(28px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .top-bar {
      width: 100%;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;

      padding-top: 4px;
    }

    .date-block {
      justify-self: start;

      display: flex;
      flex-direction: column;
      gap: 5px;

      color: var(--soft-white);

      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      line-height: 1.25;

      text-transform: uppercase;
    }

    .date-day {
      opacity: 0.92;
    }

    .date-number {
      opacity: 0.66;
    }

    /* =========================================================
       AKSH ICON
    ========================================================= */

    .brand-mark {
      justify-self: center;

      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-mark img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      filter:
        drop-shadow(0 2px 12px rgba(0, 0, 0, 0.28));

      opacity: 0.98;
    }

    .top-actions {
      justify-self: end;

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-button {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.08);

      color: white;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      cursor: pointer;

      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease;
    }

    .icon-button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.62);
      transform: translateY(-1px);
    }

    .icon-button:active {
      transform: scale(0.94);
    }

    .sound-icon {
      width: 16px;
      height: 16px;
    }

    /* =========================================================
       CENTER BRAND
    ========================================================= */

    .center {
      position: absolute;
      top: 50%;
      left: 50%;

      width: min(900px, calc(100% - 40px));

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .greeting {
      margin-bottom: 17px;

      font-size: clamp(35px, 5.2vw, 68px);
      font-weight: 300;
      letter-spacing: -0.035em;
      line-height: 1;

      color: #fff;

      text-shadow:
        0 2px 22px rgba(0, 0, 0, 0.18);

      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }

    .quote {
      width: min(590px, 90%);

      font-size: clamp(13px, 1.5vw, 17px);
      font-weight: 300;
      letter-spacing: 0.025em;
      line-height: 1.65;

      color: rgba(255, 255, 255, 0.86);

      text-shadow:
        0 2px 18px rgba(0, 0, 0, 0.28);

      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }

    /* =========================================================
       BOTTOM CTA
    ========================================================= */

    .bottom-area {
      position: absolute;
      left: 50%;
      bottom: max(34px, env(safe-area-inset-bottom));

      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;

      width: calc(100% - 40px);
    }

    .begin-button {
      min-width: 206px;
      min-height: 54px;

      padding: 15px 30px;

      border: 1px solid var(--button-border);
      border-radius: 999px;

      background: var(--button-bg);

      color: #fff;

      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.17em;
      text-transform: uppercase;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.14);

      cursor: pointer;

      transition:
        background 0.35s ease,
        border-color 0.35s ease,
        transform 0.35s ease,
        box-shadow 0.35s ease;
    }

    .begin-button:hover {
      background: rgba(255, 255, 255, 0.19);
      border-color: rgba(255, 255, 255, 0.95);

      transform: translateY(-2px);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.20);
    }

    .begin-button:active {
      transform: translateY(0) scale(0.97);
    }

    .skip-button {
      margin-top: 15px;

      border: 0;
      outline: 0;

      background: transparent;

      color: rgba(255, 255, 255, 0.67);

      font-family: inherit;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      cursor: pointer;

      transition:
        color 0.25s ease,
        opacity 0.25s ease;
    }

    .skip-button:hover {
      color: #fff;
    }

    /* =========================================================
       LOADING / TRANSITION
    ========================================================= */

    .intro-cover {
      position: fixed;
      inset: 0;
      z-index: 100;

      background: #11100f;

      pointer-events: none;

      opacity: 1;

      transition: opacity 1.1s ease;
    }

    .intro-cover.loaded {
      opacity: 0;
    }

    .page-exit {
      position: fixed;
      inset: 0;
      z-index: 200;

      background: #11100f;

      pointer-events: none;

      opacity: 0;

      transition: opacity 0.9s ease;
    }

    .page-exit.active {
      opacity: 1;
    }

    /* =========================================================
       TIME ATMOSPHERE
    ========================================================= */

    body.morning .cinematic-overlay {
      background:
        linear-gradient(
          to bottom,
          rgba(35, 25, 18, 0.13),
          rgba(255, 245, 225, 0.02) 52%,
          rgba(35, 25, 18, 0.18)
        );
    }

    body.afternoon .cinematic-overlay {
      background:
        linear-gradient(
          to bottom,
          rgba(45, 25, 10, 0.14),
          rgba(255, 180, 80, 0.02) 50%,
          rgba(45, 25, 10, 0.18)
        );
    }

    body.evening .cinematic-overlay {
      background:
        linear-gradient(
          to bottom,
          rgba(65, 35, 70, 0.24),
          rgba(115, 75, 135, 0.04) 50%,
          rgba(30, 15, 45, 0.28)
        );
    }

    body.night .cinematic-overlay {
      background:
        linear-gradient(
          to bottom,
          rgba(5, 7, 18, 0.38),
          rgba(10, 8, 28, 0.12) 50%,
          rgba(3, 4, 12, 0.48)
        );
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {
      .content {
        padding:
          max(22px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(26px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      .top-bar {
        grid-template-columns: 1fr auto 1fr;
      }

      .date-block {
        font-size: 9px;
        letter-spacing: 0.12em;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
      }

      .icon-button {
        width: 34px;
        height: 34px;
      }

      .center {
        width: calc(100% - 32px);
      }

      .greeting {
        font-size: clamp(36px, 11vw, 54px);
        margin-bottom: 15px;
      }

      .quote {
        width: min(340px, 94%);
        font-size: 13px;
        line-height: 1.65;
      }

      .begin-button {
        width: min(220px, 88vw);
        min-height: 52px;
      }

      #backgroundVideo {
        object-position: center center;
      }
    }

    @media (orientation: landscape) and (max-height: 550px) {
      .center {
        top: 52%;
      }

      .greeting {
        font-size: 36px;
        margin-bottom: 8px;
      }

      .quote {
        font-size: 12px;
        line-height: 1.45;
      }

      .bottom-area {
        bottom: 18px;
      }

      .begin-button {
        min-height: 44px;
        padding: 11px 25px;
      }

      .skip-button {
        margin-top: 8px;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="experience" id="experience">

    <!-- BACKGROUND VIDEO -->
    <div class="video-layer">
      <video
        id="backgroundVideo"
        playsinline
        autoplay
        muted
        loop
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>

    <!-- CINEMATIC LAYERS -->
    <div class="cinematic-overlay"></div>
    <div class="grain"></div>

    <!-- MAIN UI -->
    <div class="content">

      <!-- TOP -->
      <header class="top-bar">

        <!-- DATE + DAY -->
        <div class="date-block" aria-label="Current date">
          <span class="date-day" id="dayText"></span>
          <span class="date-number" id="dateText"></span>
        </div>

        <!-- AKSH ICON -->
        <div class="brand-mark">
          <img
            src="aksh-icon.PNG"
            alt="AKSH"
          />
        </div>

        <!-- SOUND -->
        <div class="top-actions">
          <button
            class="icon-button"
            id="soundButton"
            type="button"
            aria-label="Turn sound on"
            title="Sound"
          >
            <svg
              class="sound-icon"
              id="soundOnIcon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
              <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
              <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
            </svg>

            <svg
              class="sound-icon"
              id="soundOffIcon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="display:none;"
            >
              <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
              <path d="m18 9-6 6"></path>
              <path d="m12 9 6 6"></path>
            </svg>
          </button>
        </div>

      </header>

      <!-- CENTER -->
      <section class="center">

        <h1 class="greeting" id="greeting">
          Good Morning
        </h1>

        <p class="quote" id="quote">
          Take a breath. You are allowed to arrive exactly as you are.
        </p>

      </section>

      <!-- BOTTOM -->
      <div class="bottom-area">

        <button
          class="begin-button"
          id="beginButton"
          type="button"
        >
          Begin Your Journey
        </button>

        <button
          class="skip-button"
          id="skipButton"
          type="button"
        >
          Skip
        </button>

      </div>

    </div>

  </main>

  <!-- INITIAL COVER -->
  <div class="intro-cover" id="introCover"></div>

  <!-- PAGE EXIT -->
  <div class="page-exit" id="pageExit"></div>


  <script>
    /*
      ============================================================
      AKSH — ZERO PAGE
      FINAL TIME-BASED VIDEO ENGINE
      ============================================================

      IMPORTANT:
      The filenames below exactly match the supplied AKSH assets.

      Time mapping:

      05:00–06:00  morning 1
      06:00–08:00  morning 2
      08:00–10:00  morning 3
      10:00–11:59 morning 4

      12:00–13:00  afternoon 1
      13:00–14:30  afternoon 2
      14:30–16:00  afternoon 3
      16:00–17:00  afternoon 4

      17:00–17:45  evening 1
      17:45–19:00  evening 2
      19:00–20:00  evening 3

      20:00–00:00  night 1
      00:00–05:00  night 2
    */

    (() => {
      "use strict";

      const video = document.getElementById("backgroundVideo");
      const greeting = document.getElementById("greeting");
      const quote = document.getElementById("quote");
      const dayText = document.getElementById("dayText");
      const dateText = document.getElementById("dateText");

      const beginButton = document.getElementById("beginButton");
      const skipButton = document.getElementById("skipButton");

      const soundButton = document.getElementById("soundButton");
      const soundOnIcon = document.getElementById("soundOnIcon");
      const soundOffIcon = document.getElementById("soundOffIcon");

      const introCover = document.getElementById("introCover");
      const pageExit = document.getElementById("pageExit");

      let currentVideo = "";
      let soundEnabled = false;

      /*
        ------------------------------------------------------------
        EXACT VIDEO ASSET MAP
        ------------------------------------------------------------
      */

      const videos = {
        morning1: "aksh-morning.1.mov",
        morning2: "aksh-morning.2.mov",
        morning3: "aksh-morning.3.mov",
        morning4: "aksh-morning.4.mov",

        afternoon1: "aksh-afternoon.1.mov",
        afternoon2: "aksh-afternoon.2.mov",
        afternoon3: "aksh-afternoon.3.mov",
        afternoon4: "aksh-afternoon.4.mov",

        evening1: "aksh-evening.1.mov",
        evening2: "aksh-evening.2.mov",
        evening3: "aksh-evening.3.mov",

        night1: "aksh-night.1.mov",
        night2: "aksh-night.2.mov"
      };

      /*
        ------------------------------------------------------------
        SHORT TIME-SPECIFIC MESSAGES
        ------------------------------------------------------------
      */

      const messages = {
        morning: [
          "Take a breath. You are allowed to arrive exactly as you are.",
          "Let the morning be gentle with you.",
          "There is nowhere else you need to be right now.",
          "A quiet moment can make space for everything within you."
        ],

        afternoon: [
          "Pause for a moment. You don't have to carry everything at once.",
          "Let a little warmth find its way into your day.",
          "You can slow down without falling behind.",
          "There is still beauty in the middle of an ordinary day."
        ],

        evening: [
          "Let the day become quieter. You can simply be here.",
          "Some moments are meant to be felt, not hurried through.",
          "You made it here. Take a moment for yourself."
        ],

        night: [
          "The world can wait. Give yourself a quiet moment.",
          "Rest. Breathe. You are safe to slow down."
        ]
      };

      /*
        ------------------------------------------------------------
        GET CURRENT LOCAL TIME
        ------------------------------------------------------------
      */

      function getTimeInMinutes() {
        const now = new Date();

        return (
          now.getHours() * 60 +
          now.getMinutes() +
          now.getSeconds() / 60
        );
      }

      /*
        ------------------------------------------------------------
        DETERMINE CURRENT EXPERIENCE
        ------------------------------------------------------------
      */

      function getExperience() {
        const minutes = getTimeInMinutes();

        /*
          NIGHT 2
          00:00–04:59
        */
        if (minutes >= 0 && minutes < 300) {
          return {
            period: "night",
            greeting: "Good Night",
            video: videos.night2,
            messageIndex: 1
          };
        }

        /*
          MORNING 1
          05:00–05:59
        */
        if (minutes >= 300 && minutes < 360) {
          return {
            period: "morning",
            greeting: "Good Morning",
            video: videos.morning1,
            messageIndex: 0
          };
        }

        /*
          MORNING 2
          06:00–07:59
        */
        if (minutes >= 360 && minutes < 480) {
          return {
            period: "morning",
            greeting: "Good Morning",
            video: videos.morning2,
            messageIndex: 1
          };
        }

        /*
          MORNING 3
          08:00–09:59
        */
        if (minutes >= 480 && minutes < 600) {
          return {
            period: "morning",
            greeting: "Good Morning",
            video: videos.morning3,
            messageIndex: 2
          };
        }

        /*
          MORNING 4
          10:00–11:59
        */
        if (minutes >= 600 && minutes < 720) {
          return {
            period: "morning",
            greeting: "Good Morning",
            video: videos.morning4,
            messageIndex: 3
          };
        }

        /*
          AFTERNOON 1
          12:00–12:59
        */
        if (minutes >= 720 && minutes < 780) {
          return {
            period: "afternoon",
            greeting: "Good Afternoon",
            video: videos.afternoon1,
            messageIndex: 0
          };
        }

        /*
          AFTERNOON 2
          13:00–14:29
        */
        if (minutes >= 780 && minutes < 870) {
          return {
            period: "afternoon",
            greeting: "Good Afternoon",
            video: videos.afternoon2,
            messageIndex: 1
          };
        }

        /*
          AFTERNOON 3
          14:30–15:59
        */
        if (minutes >= 870 && minutes < 960) {
          return {
            period: "afternoon",
            greeting: "Good Afternoon",
            video: videos.afternoon3,
            messageIndex: 2
          };
        }

        /*
          AFTERNOON 4
          16:00–16:59
        */
        if (minutes >= 960 && minutes < 1020) {
          return {
            period: "afternoon",
            greeting: "Good Afternoon",
            video: videos.afternoon4,
            messageIndex: 3
          };
        }

        /*
          EVENING 1
          17:00–17:44
        */
        if (minutes >= 1020 && minutes < 1065) {
          return {
            period: "evening",
            greeting: "Good Evening",
            video: videos.evening1,
            messageIndex: 0
          };
        }

        /*
          EVENING 2
          17:45–18:59
        */
        if (minutes >= 1065 && minutes < 1140) {
          return {
            period: "evening",
            greeting: "Good Evening",
            video: videos.evening2,
            messageIndex: 1
          };
        }

        /*
          EVENING 3
          19:00–19:59
        */
        if (minutes >= 1140 && minutes < 1200) {
          return {
            period: "evening",
            greeting: "Good Evening",
            video: videos.evening3,
            messageIndex: 2
          };
        }

        /*
          NIGHT 1
          20:00–23:59
        */
        return {
          period: "night",
          greeting: "Good Night",
          video: videos.night1,
          messageIndex: 0
        };
      }

      /*
        ------------------------------------------------------------
        DATE + DAY
        ------------------------------------------------------------
      */

      function updateDate() {
        const now = new Date();

        const dayFormatter = new Intl.DateTimeFormat(undefined, {
          weekday: "long"
        });

        const dateFormatter = new Intl.DateTimeFormat(undefined, {
          day: "2-digit",
          month: "long",
          year: "numeric"
        });

        dayText.textContent = dayFormatter.format(now);

        dateText.textContent = dateFormatter.format(now);
      }

      /*
        ------------------------------------------------------------
        APPLY EXPERIENCE
        ------------------------------------------------------------
      */

      function applyExperience() {
        const experience = getExperience();

        document.body.classList.remove(
          "morning",
          "afternoon",
          "evening",
          "night"
        );

        document.body.classList.add(experience.period);

        greeting.textContent = experience.greeting;

        quote.textContent =
          messages[experience.period][experience.messageIndex];

        /*
          Only change video when the actual time window changes.
        */

        if (currentVideo !== experience.video) {
          loadVideo(experience.video);
        }
      }

      /*
        ------------------------------------------------------------
        LOAD VIDEO
        ------------------------------------------------------------
      */

      function loadVideo(source) {
        currentVideo = source;

        video.classList.remove("visible");

        /*
          Stop previous video.
        */

        video.pause();

        /*
          Set the new exact supplied file.
        */

        video.src = source;
        video.load();

        /*
          When the video is ready, reveal it.
        */

        const reveal = () => {
          video.classList.add("visible");

          attemptPlayback();
        };

        video.addEventListener(
          "canplay",
          reveal,
          { once: true }
        );

        /*
          Fallback in case canplay has already fired.
        */

        setTimeout(() => {
          if (!video.classList.contains("visible")) {
            video.classList.add("visible");
            attemptPlayback();
          }
        }, 2200);
      }

      /*
        ------------------------------------------------------------
        AUTOPLAY
        ------------------------------------------------------------

        Browsers may block autoplay WITH SOUND.

        We first attempt sound.
        If the browser blocks it, the video still starts muted.
        The sound button can immediately enable the original audio.
      */

      async function attemptPlayback() {
        try {
          video.muted = !soundEnabled;

          await video.play();
        } catch (error) {
          /*
            Browser autoplay policy prevented playback.

            Retry muted so the visual experience still starts.
          */

          try {
            video.muted = true;
            soundEnabled = false;

            updateSoundUI();

            await video.play();
          } catch (secondError) {
            /*
              Nothing else required.
            */
          }
        }
      }

      /*
        ------------------------------------------------------------
        SOUND CONTROL
        ------------------------------------------------------------
      */

      function updateSoundUI() {
        if (soundEnabled) {
          soundOnIcon.style.display = "block";
          soundOffIcon.style.display = "none";

          soundButton.setAttribute(
            "aria-label",
            "Turn sound off"
          );
        } else {
          soundOnIcon.style.display = "none";
          soundOffIcon.style.display = "block";

          soundButton.setAttribute(
            "aria-label",
            "Turn sound on"
          );
        }
      }

      async function toggleSound() {
        soundEnabled = !soundEnabled;

        video.muted = !soundEnabled;

        updateSoundUI();

        try {
          await video.play();
        } catch (error) {
          /*
            If playback is blocked, the next user interaction
            will allow it.
          */
        }
      }

      soundButton.addEventListener(
        "click",
        toggleSound
      );

      /*
        ------------------------------------------------------------
        BEGIN JOURNEY
        ------------------------------------------------------------

        Page 1 will be built separately.

        The destination is intentionally kept as:
        home.html

        so the Zero Page does not need to be rebuilt when Page 1
        is added.
      */

      function enterWebsite() {
        pageExit.classList.add("active");

        setTimeout(() => {
          window.location.href = "home.html";
        }, 850);
      }

      beginButton.addEventListener(
        "click",
        enterWebsite
      );

      skipButton.addEventListener(
        "click",
        enterWebsite
      );

      /*
        ------------------------------------------------------------
        INITIALISE
        ------------------------------------------------------------
      */

      updateDate();
      updateSoundUI();
      applyExperience();

      /*
        Re-check every second.

        This means the correct video changes automatically when
        the visitor crosses a time boundary.
      */

      setInterval(() => {
        updateDate();
        applyExperience();
      }, 1000);

      /*
        ------------------------------------------------------------
        PAGE VISIBILITY
        ------------------------------------------------------------
      */

      document.addEventListener(
        "visibilitychange",
        () => {
          if (!document.hidden) {
            updateDate();
            applyExperience();
            attemptPlayback();
          }
        }
      );

      /*
        ------------------------------------------------------------
        FIRST TOUCH
        ------------------------------------------------------------

        If the browser initially blocks sound, the first interaction
        anywhere on the page attempts to enable the video/audio.
      */

      const firstInteraction = async () => {
        if (!soundEnabled) {
          return;
        }

        try {
          video.muted = false;
          await video.play();
        } catch (error) {
          /*
            Browser policy may still require explicit sound control.
          */
        }
      };

      document.addEventListener(
        "pointerdown",
        firstInteraction,
        { once: true, passive: true }
      );

      /*
        ------------------------------------------------------------
        REMOVE INITIAL COVER
        ------------------------------------------------------------
      */

      window.addEventListener(
        "load",
        () => {
          setTimeout(() => {
            introCover.classList.add("loaded");
          }, 350);
        }
      );

    })();
  </script>

</body>
</html>
