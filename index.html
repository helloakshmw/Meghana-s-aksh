<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#09090b"
    >

    <meta
        name="description"
        content="AKSH — A Safe Space for Every Mind."
    >

    <title>AKSH — A Safe Space for Every Mind</title>

    <!-- =========================================================
         AKSH — ARRIVAL
         Free typography
         ========================================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         00 — ARRIVAL
         ========================================================= -->

    <main id="arrival" class="arrival">

        <!-- Cinematic background video -->
        <video
            id="backgroundVideo"
            class="background-video"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto"
            aria-hidden="true"
        ></video>

        <!-- Atmospheric layers -->
        <div
            id="atmosphere"
            class="atmosphere"
            aria-hidden="true"
        ></div>

        <div
            class="vignette"
            aria-hidden="true"
        ></div>

        <div
            class="grain"
            aria-hidden="true"
        ></div>

        <!-- =====================================================
             TOP CONTROL
             ===================================================== -->

        <header class="top-bar">

            <button
                id="soundToggle"
                class="sound-toggle"
                type="button"
                aria-label="Turn sound on"
                aria-pressed="false"
            >

                <span
                    id="soundIcon"
                    class="sound-icon"
                    aria-hidden="true"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                <span
                    id="soundLabel"
                    class="sound-label"
                >
                    SOUND OFF
                </span>

            </button>

        </header>

        <!-- =====================================================
             MAIN ARRIVAL CONTENT
             ===================================================== -->

        <section
            class="arrival-content"
            aria-labelledby="brandName"
        >

            <!-- AKSH identity -->
            <div class="brand">

                <img
                    id="akshIcon"
                    class="aksh-icon"
                    src="aksh-icon.PNG"
                    alt="AKSH"
                    draggable="false"
                >

                <div class="brand-name" id="brandName">
                    AKSH
                </div>

                <div class="tagline">
                    A Safe Space for Every Mind
                </div>

            </div>

            <!-- =================================================
                 TIME / GREETING
                 ================================================= -->

            <div class="greeting-area">

                <div
                    id="timeDisplay"
                    class="time-display"
                    aria-live="polite"
                ></div>

                <h1
                    id="greeting"
                    class="greeting"
                    aria-live="polite"
                ></h1>

                <p
                    id="reflection"
                    class="reflection"
                    aria-live="polite"
                ></p>

            </div>

            <!-- =================================================
                 BEGIN
                 ================================================= -->

            <div class="begin-area">

                <button
                    id="beginButton"
                    class="begin-button"
                    type="button"
                >

                    <span class="begin-text">
                        Begin Your Journey
                    </span>

                    <span
                        class="begin-arrow"
                        aria-hidden="true"
                    >
                        →
                    </span>

                </button>

            </div>

        </section>

        <!-- =====================================================
             ARRIVAL FOOTER
             ===================================================== -->

        <footer class="arrival-footer">

            <span class="arrival-number">
                00
            </span>

            <span
                class="footer-line"
                aria-hidden="true"
            ></span>

            <span class="arrival-label">
                ARRIVAL
            </span>

        </footer>

    </main>

    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="script.js" defer></script>

</body>
</html>
