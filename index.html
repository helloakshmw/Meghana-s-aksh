<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#11100f">

<title>AKSH — A Safe Space For Every Mind</title>

<link rel="icon" type="image/png" href="aksh-icon.PNG">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow: hidden;
}

body {
    background: #000;
    color: #fff;
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

button {
    font: inherit;
}


/* =========================================================
   VIDEO BACKGROUND
========================================================= */

#backgroundVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    background: #000;
    z-index: -5;
}

#videoOverlay {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.30) 0%,
            rgba(0,0,0,0.05) 35%,
            rgba(0,0,0,0.16) 65%,
            rgba(0,0,0,0.50) 100%
        );
    z-index: -4;
    pointer-events: none;
}


/* =========================================================
   PAGE TRANSITION
========================================================= */

#pageTransition {
    position: fixed;
    inset: 0;
    background: #11100f;
    z-index: 9999;
    opacity: 1;
    visibility: visible;
    pointer-events: none;
    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#pageTransition.ready {
    opacity: 0;
    visibility: hidden;
}


/* =========================================================
   TOP AREA
========================================================= */

.top-area {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding:
        calc(env(safe-area-inset-top) + 18px)
        28px
        0;
    z-index: 20;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;

    pointer-events: none;
}


/* =========================================================
   DATE — TOP LEFT
========================================================= */

.date-block {
    justify-self: start;
    text-align: left;
    pointer-events: auto;
    line-height: 1;
}

.date-text {
    display: block;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .16em;
    color: rgba(255,255,255,.92);
}

.day-text {
    display: block;
    margin-top: 7px;
    font-size: 8px;
    font-weight: 400;
    letter-spacing: .28em;
    color: rgba(255,255,255,.60);
}


/* =========================================================
   CENTER BRAND
========================================================= */

.center-brand {
    justify-self: center;
    text-align: center;
    pointer-events: none;
}

.center-icon {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
    margin: 0 auto 5px;
}

.center-name {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: 25px;
    line-height: .8;
    font-weight: 500;
    letter-spacing: .10em;
    color: #fff;
}

.center-tagline {
    display: block;
    margin-top: 7px;
    font-size: 6px;
    font-weight: 400;
    letter-spacing: .20em;
    white-space: nowrap;
    color: rgba(255,255,255,.68);
}


/* =========================================================
   MENU BUTTON — TOP RIGHT
========================================================= */

.menu-button {
    justify-self: end;

    width: 50px;
    height: 50px;

    border: 1px solid rgba(255,255,255,.35);
    border-radius: 50%;

    background: rgba(20,20,20,.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 7px;

    cursor: pointer;
    pointer-events: auto;

    transition:
        background .3s ease,
        transform .3s ease;
}

.menu-button:active {
    transform: scale(.94);
}

.menu-line {
    width: 23px;
    height: 1px;
    background: #fff;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content {
    position: fixed;
    inset: 0;
    z-index: 5;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding:
        150px
        24px
        170px;
}


/* =========================================================
   GREETING
========================================================= */

#greeting {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(58px, 9vw, 125px);
    font-weight: 400;
    line-height: .9;
    letter-spacing: -.035em;

    color: #fff;

    text-shadow:
        0 2px 20px rgba(0,0,0,.25);
}


/* =========================================================
   MESSAGE
========================================================= */

#arrivalMessage {
    margin-top: 28px;

    max-width: 620px;

    font-size: clamp(14px, 1.7vw, 18px);
    line-height: 1.7;
    font-weight: 300;

    color: rgba(255,255,255,.86);

    text-shadow:
        0 2px 15px rgba(0,0,0,.30);
}


/* =========================================================
   BEGIN BUTTON
========================================================= */

#beginButton {
    margin-top: 42px;

    min-width: 245px;
    min-height: 58px;

    padding: 0 30px;

    border-radius: 40px;
    border: 1px solid rgba(255,255,255,.45);

    background: rgba(25,25,25,.25);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    color: #fff;

    font-size: 11px;
    font-weight: 400;
    letter-spacing: .20em;

    cursor: pointer;

    transition:
        background .3s ease,
        transform .3s ease,
        border-color .3s ease;
}

#beginButton:hover {
    background: rgba(255,255,255,.15);
    border-color: rgba(255,255,255,.75);
}

#beginButton:active {
    transform: scale(.97);
}


/* =========================================================
   BOTTOM LEFT — SOUND
========================================================= */

.sound-button {
    position: fixed;

    left: 28px;
    bottom:
        calc(env(safe-area-inset-bottom) + 28px);

    z-index: 30;

    min-width: 150px;
    height: 48px;

    padding: 0 19px;

    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.35);

    background: rgba(20,20,20,.22);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    color: #fff;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    font-size: 10px;
    letter-spacing: .17em;

    cursor: pointer;

    transition:
        background .3s ease,
        transform .3s ease;
}

.sound-button:active {
    transform: scale(.96);
}

.sound-icon {
    font-size: 14px;
    line-height: 1;
}


/* =========================================================
   MEGHANA SMALL ICON
   REPLACES VIDEO COUNT
========================================================= */

.meghana-corner {
    position: fixed;

    right: 28px;
    bottom:
        calc(env(safe-area-inset-bottom) + 28px);

    z-index: 30;

    width: 46px;
    height: 46px;

    border-radius: 50%;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.55);

    background: rgba(255,255,255,.12);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow:
        0 5px 25px rgba(0,0,0,.20);
}

.meghana-corner img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress-area {
    position: fixed;

    left: 50%;
    bottom:
        calc(env(safe-area-inset-bottom) + 17px);

    transform: translateX(-50%);

    width: min(150px, 28vw);

    z-index: 25;
}

.progress-track {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,.28);
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: rgba(255,255,255,.90);
}


/* =========================================================
   NAVIGATION OVERLAY
========================================================= */

#navigation {
    position: fixed;
    inset: 0;

    z-index: 100;

    background:
        rgba(10,10,10,.96);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

#navigation.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.close-menu {
    position: absolute;

    top:
        calc(env(safe-area-inset-top) + 18px);

    right: 28px;

    width: 50px;
    height: 50px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.30);

    background: transparent;

    cursor: pointer;
}

.close-menu::before,
.close-menu::after {
    content: "";

    position: absolute;

    top: 50%;
    left: 50%;

    width: 24px;
    height: 1px;

    background: #fff;
}

.close-menu::before {
    transform:
        translate(-50%, -50%)
        rotate(45deg);
}

.close-menu::after {
    transform:
        translate(-50%, -50%)
        rotate(-45deg);
}

.navigation-inner {
    width: min(900px, calc(100% - 50px));
    height: 100%;

    margin: auto;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.navigation-label {
    margin-bottom: 28px;

    font-size: 9px;
    letter-spacing: .25em;

    color: rgba(255,255,255,.42);
}

.navigation-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0 60px;
}

.navigation-links a {
    padding: 18px 0;

    border-bottom:
        1px solid rgba(255,255,255,.12);

    color: #fff;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: clamp(28px, 4vw, 48px);

    transition:
        color .25s ease,
        padding-left .25s ease;
}

.navigation-links a:hover {
    color: #d4c4b1;
    padding-left: 8px;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .top-area {
        padding-left: 22px;
        padding-right: 22px;
    }

    .content {
        padding:
            150px
            25px
            150px;
    }

    #greeting {
        font-size: clamp(58px, 12vw, 100px);
    }

    #arrivalMessage {
        max-width: 520px;
    }

    .navigation-links {
        grid-template-columns: 1fr;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #backgroundVideo {
        object-position: center center;
    }

    .top-area {
        padding:
            calc(env(safe-area-inset-top) + 14px)
            16px
            0;
    }

    .date-text {
        font-size: 9px;
        letter-spacing: .12em;
    }

    .day-text {
        margin-top: 6px;
        font-size: 7px;
        letter-spacing: .22em;
    }

    .center-icon {
        width: 32px;
        height: 32px;
        margin-bottom: 4px;
    }

    .center-name {
        font-size: 21px;
        letter-spacing: .09em;
    }

    .center-tagline {
        margin-top: 6px;
        font-size: 5px;
        letter-spacing: .15em;
    }

    .menu-button {
        width: 44px;
        height: 44px;
    }

    .menu-line {
        width: 21px;
    }

    .content {
        padding:
            135px
            20px
            145px;
    }

    #greeting {
        font-size: clamp(52px, 16vw, 76px);
        line-height: .88;
    }

    #arrivalMessage {
        max-width: 320px;

        margin-top: 22px;

        font-size: 13px;
        line-height: 1.7;
    }

    #beginButton {
        min-width: 220px;
        min-height: 54px;

        margin-top: 32px;

        font-size: 10px;
        letter-spacing: .17em;
    }

    .sound-button {
        left: 16px;

        bottom:
            calc(env(safe-area-inset-bottom) + 18px);

        min-width: 135px;
        height: 44px;

        padding: 0 15px;

        font-size: 9px;
        letter-spacing: .13em;
    }

    .meghana-corner {
        right: 16px;

        bottom:
            calc(env(safe-area-inset-bottom) + 18px);

        width: 42px;
        height: 42px;
    }

    .progress-area {
        bottom:
            calc(env(safe-area-inset-bottom) + 10px);

        width: 95px;
    }

    .navigation-inner {
        width: calc(100% - 40px);
    }

    .navigation-links a {
        font-size: 32px;
        padding: 15px 0;
    }

    .close-menu {
        right: 16px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .center-tagline {
        display: none;
    }

    .center-name {
        font-size: 19px;
    }

    #greeting {
        font-size: 49px;
    }

    #arrivalMessage {
        font-size: 12px;
    }

    #beginButton {
        min-width: 205px;
    }

    .sound-button {
        min-width: 125px;
    }

    .meghana-corner {
        width: 39px;
        height: 39px;
    }
}


/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media
(max-height: 500px)
and (orientation: landscape) {

    .top-area {
        padding-top:
            calc(env(safe-area-inset-top) + 8px);
    }

    .center-icon {
        width: 25px;
        height: 25px;
    }

    .center-name {
        font-size: 18px;
    }

    .center-tagline {
        display: none;
    }

    .content {
        padding:
            90px
            30px
            85px;
    }

    #greeting {
        font-size: 55px;
    }

    #arrivalMessage {
        margin-top: 12px;
        font-size: 11px;
    }

    #beginButton {
        margin-top: 15px;
        min-height: 43px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}

</style>

</head>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("backgroundVideo");

const greeting =
    document.getElementById("greeting");

const arrivalMessage =
    document.getElementById("arrivalMessage");

const dateText =
    document.getElementById("dateText");

const dayText =
    document.getElementById("dayText");

const soundButton =
    document.getElementById("soundButton");

const soundIcon =
    document.getElementById("soundIcon");

const soundText =
    document.getElementById("soundText");

const beginButton =
    document.getElementById("beginButton");

const progressFill =
    document.getElementById("progressFill");

const menuButton =
    document.getElementById("menuButton");

const closeMenu =
    document.getElementById("closeMenu");

const navigation =
    document.getElementById("navigation");

const pageTransition =
    document.getElementById("pageTransition");


/* =========================================================
   VIDEO LIST
========================================================= */

const videos = [

    "aksh-morning.1.mov",
    "aksh-morning.2.mov",
    "aksh-morning.3.mov",
    "aksh-morning.4.mov",

    "aksh-afternoon.1.mov",
    "aksh-afternoon.2.mov",
    "aksh-afternoon.3.mov",
    "aksh-afternoon.4.mov",

    "aksh-evening.1.mov",
    "aksh-evening.2.mov",
    "aksh-evening.3.mov",

    "aksh-night.1.mov",
    "aksh-night.2.mov"

];


/* =========================================================
   TIME PERIOD
========================================================= */

function getCurrentMinutes() {

    const now = new Date();

    return (
        now.getHours() * 60 +
        now.getMinutes()
    );

}


function getTimePeriod() {

    const minutes =
        getCurrentMinutes();


    if (
        minutes >= 300 &&
        minutes < 720
    ) {

        return "morning";

    }


    if (
        minutes >= 720 &&
        minutes < 1020
    ) {

        return "afternoon";

    }


    if (
        minutes >= 1020 &&
        minutes < 1200
    ) {

        return "evening";

    }


    return "night";

}


/* =========================================================
   TIME CONTENT
========================================================= */

const timeContent = {

    morning: {

        greeting:
            "Good Morning",

        message:
            "A new day is here. Take a breath. Begin gently."

    },

    afternoon: {

        greeting:
            "Good Afternoon",

        message:
            "Pause for a moment. You are allowed to slow down."

    },

    evening: {

        greeting:
            "Good Evening",

        message:
            "Take a breath. You are here."

    },

    night: {

        greeting:
            "Good Night",

        message:
            "Let the day become quiet. Give yourself some space."

    }

};


/* =========================================================
   VIDEO GROUPS
========================================================= */

const videoGroups = {

    morning: [
        "aksh-morning.1.mov",
        "aksh-morning.2.mov",
        "aksh-morning.3.mov",
        "aksh-morning.4.mov"
    ],

    afternoon: [
        "aksh-afternoon.1.mov",
        "aksh-afternoon.2.mov",
        "aksh-afternoon.3.mov",
        "aksh-afternoon.4.mov"
    ],

    evening: [
        "aksh-evening.1.mov",
        "aksh-evening.2.mov",
        "aksh-evening.3.mov"
    ],

    night: [
        "aksh-night.1.mov",
        "aksh-night.2.mov"
    ]

};


/* =========================================================
   DATE
========================================================= */

function updateDate() {

    const now =
        new Date();

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const year =
        now.getFullYear();

    dateText.textContent =
        `${day}.${month}.${year}`;


    const weekday =
        now
        .toLocaleDateString(
            "en-IN",
            {
                weekday: "long"
            }
        )
        .toUpperCase();

    dayText.textContent =
        weekday;

}


/* =========================================================
   UPDATE GREETING
========================================================= */

function updateGreeting() {

    const period =
        getTimePeriod();

    const content =
        timeContent[period];

    greeting.textContent =
        content.greeting;

    arrivalMessage.textContent =
        content.message;

}


/* =========================================================
   VIDEO STATE
========================================================= */

let currentVideos = [];

let currentVideoIndex = 0;

let videoTimer = null;

let progressTimer = null;

const VIDEO_DURATION = 4000;


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(
    source,
    autoplay = true
) {

    if (!source) {
        return;
    }


    video.src = source;

    video.load();


    const playVideo =
        () => {

            if (!autoplay) {
                return;
            }

            video.play()
                .catch(
                    () => {
                        /*
                         Autoplay may be blocked
                         until the user interacts.
                        */
                    }
                );

        };


    video.addEventListener(
        "canplay",
        playVideo,
        {
            once: true
        }
    );

}


/* =========================================================
   START CURRENT VIDEO
========================================================= */

function startVideoSequence() {

    const period =
        getTimePeriod();

    currentVideos =
        videoGroups[period];

    currentVideoIndex = 0;

    loadVideo(
        currentVideos[currentVideoIndex]
    );

    startVideoTimer();

}


/* =========================================================
   VIDEO TIMER
========================================================= */

function startVideoTimer() {

    clearTimeout(videoTimer);

    clearInterval(progressTimer);


    progressFill.style.width =
        "0%";


    const startTime =
        Date.now();


    progressTimer =
        setInterval(
            () => {

                const elapsed =
                    Date.now() -
                    startTime;

                const progress =
                    Math.min(
                        (elapsed /
                        VIDEO_DURATION) *
                        100,
                        100
                    );

                progressFill.style.width =
                    `${progress}%`;

            },
            40
        );


    videoTimer =
        setTimeout(
            nextVideo,
            VIDEO_DURATION
        );

}


/* =========================================================
   NEXT VIDEO
========================================================= */

function nextVideo() {

    clearInterval(progressTimer);

    currentVideoIndex++;


    if (
        currentVideoIndex >=
        currentVideos.length
    ) {

        currentVideoIndex = 0;

    }


    loadVideo(
        currentVideos[currentVideoIndex]
    );


    startVideoTimer();

}


/* =========================================================
   VIDEO ENDED
========================================================= */

video.addEventListener(
    "ended",
    () => {

        nextVideo();

    }
);


/* =========================================================
   SOUND
========================================================= */

let soundEnabled = false;


soundButton.addEventListener(
    "click",
    () => {

        soundEnabled =
            !soundEnabled;

        video.muted =
            !soundEnabled;


        if (soundEnabled) {

            soundText.textContent =
                "SOUND OFF";

            soundIcon.textContent =
                "▶";

            video.play()
                .catch(
                    () => {}
                );

        } else {

            soundText.textContent =
                "SOUND ON";

            soundIcon.textContent =
                "◀";

        }

    }
);


/* =========================================================
   BEGIN JOURNEY
========================================================= */

beginButton.addEventListener(
    "click",
    () => {

        pageTransition.classList.remove(
            "ready"
        );


        pageTransition.style.pointerEvents =
            "auto";


        setTimeout(
            () => {

                window.location.href =
                    "aksh.html";

            },
            700
        );

    }
);


/* =========================================================
   NAVIGATION
========================================================= */

function openNavigation() {

    navigation.classList.add(
        "open"
    );

    navigation.setAttribute(
        "aria-hidden",
        "false"
    );

    menuButton.setAttribute(
        "aria-expanded",
        "true"
    );

}


function closeNavigation() {

    navigation.classList.remove(
        "open"
    );

    navigation.setAttribute(
        "aria-hidden",
        "true"
    );

    menuButton.setAttribute(
        "aria-expanded",
        "false"
    );

}


menuButton.addEventListener(
    "click",
    openNavigation
);


closeMenu.addEventListener(
    "click",
    closeNavigation
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape"
        ) {

            closeNavigation();

        }

    }
);


/* =========================================================
   NAVIGATION PAGE TRANSITIONS
========================================================= */

navigation
    .querySelectorAll("a")
    .forEach(
        (link) => {

            link.addEventListener(
                "click",
                (event) => {

                    const destination =
                        link.getAttribute(
                            "href"
                        );


                    if (!destination) {
                        return;
                    }


                    event.preventDefault();


                    closeNavigation();


                    pageTransition.classList.remove(
                        "ready"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                destination;

                        },
                        700
                    );

                }
            );

        }
    );


/* =========================================================
   INITIALISE
========================================================= */

function initialise() {

    updateDate();

    updateGreeting();

    startVideoSequence();


    setTimeout(
        () => {

            pageTransition.classList.add(
                "ready"
            );

        },
        100
    );

}


initialise();


/* =========================================================
   UPDATE DATE / TIME CONTENT
   WITHOUT RELOADING THE PAGE
========================================================= */

setInterval(
    () => {

        updateDate();

        updateGreeting();

    },
    60000
);


/* =========================================================
   PAGE SHOW / BACK BUTTON
========================================================= */

window.addEventListener(
    "pageshow",
    () => {

        pageTransition.classList.add(
            "ready"
        );

        closeNavigation();

    }
);

</script>


</body>
</html>
