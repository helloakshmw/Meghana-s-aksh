<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b0a09"
    >

    <meta
        name="description"
        content="AKSH Mental Wellness — A Safe Space For Every Mind."
    >

    <title>AKSH — A Safe Space For Every Mind</title>


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="aksh-icon.PNG"
    >


    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Allura&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         STYLES
    ====================================================== -->

    <style>

        :root {
            --white: #ffffff;
            --soft-white: rgba(255,255,255,0.92);
            --muted-white: rgba(255,255,255,0.68);
            --line: rgba(255,255,255,0.22);
            --dark: #090807;
            --overlay: rgba(0,0,0,0.30);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        html {
            overflow: hidden;
        }


        body {
            position: relative;
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
            background: #000;
            color: var(--white);
            font-family: "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }


        body.menu-open {
            overflow: hidden;
        }


        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }


        button {
            font: inherit;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* =====================================================
           SINGLE BACKGROUND VIDEO
        ====================================================== */

        #backgroundVideo {
            position: fixed;
            inset: 0;
            z-index: 0;

            display: block;

            width: 100vw;
            height: 100svh;

            min-width: 100%;
            min-height: 100%;

            object-fit: cover;
            object-position: center center;

            background: #000;

            opacity: 1;

            pointer-events: none;
        }


        /*
         * IMPORTANT:
         * There is ONLY ONE video element.
         * No second video.
         * No video background layers.
         */


        /* =====================================================
           VIDEO OVERLAY
        ====================================================== */

        #videoOverlay {
            position: fixed;
            inset: 0;
            z-index: 1;

            background:
                linear-gradient(
                    180deg,
                    rgba(0,0,0,0.18) 0%,
                    rgba(0,0,0,0.06) 40%,
                    rgba(0,0,0,0.35) 100%
                );

            pointer-events: none;
        }


        /* =====================================================
           TOP DATE
        ====================================================== */

        .arrival-date {
            position: fixed;

            top:
                calc(
                    env(safe-area-inset-top) + 24px
                );

            left: 22px;

            z-index: 20;

            display: flex;
            flex-direction: column;

            align-items: flex-start;

            pointer-events: none;
        }


        #arrivalDate {
            font-size: 10px;
            font-weight: 400;

            letter-spacing: 0.18em;

            line-height: 1.4;

            color: var(--soft-white);
        }


        #arrivalDay {
            margin-top: 3px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 17px;
            font-weight: 400;

            line-height: 1;

            color: var(--soft-white);
        }


        /* =====================================================
           TOP CENTER BRAND
        ====================================================== */

        .arrival-brand {
            position: fixed;

            top:
                calc(
                    env(safe-area-inset-top) + 22px
                );

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;

            display: flex;
            flex-direction: column;

            align-items: center;

            text-align: center;

            pointer-events: none;
        }


        .arrival-brand-main {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;
        }


        .arrival-brand-icon {
            width: 31px;
            height: 31px;

            object-fit: contain;

            display: block;
        }


        .arrival-brand-name {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 27px;
            font-weight: 500;

            letter-spacing: 0.08em;

            line-height: 1;

            color: var(--white);
        }


        .arrival-brand-tagline {
            margin-top: 6px;

            font-size: 7px;
            font-weight: 400;

            letter-spacing: 0.22em;

            text-transform: uppercase;

            white-space: nowrap;

            color:
                rgba(255,255,255,0.72);
        }


        /* =====================================================
           MENU BUTTON
        ====================================================== */

        #menuButton {
            position: fixed;

            top:
                calc(
                    env(safe-area-inset-top) + 20px
                );

            right: 20px;

            z-index: 30;

            width: 44px;
            height: 44px;

            border: 0;

            background:
                rgba(0,0,0,0.08);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            border-radius: 50%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: flex-end;

            gap: 6px;

            padding-right: 11px;

            cursor: pointer;
        }


        .menu-line {
            display: block;

            height: 1px;

            background:
                rgba(255,255,255,0.9);

            transition:
                width 0.3s ease;
        }


        .menu-line:first-child {
            width: 22px;
        }


        .menu-line:last-child {
            width: 15px;
        }


        #menuButton:hover
        .menu-line:first-child {
            width: 15px;
        }


        #menuButton:hover
        .menu-line:last-child {
            width: 22px;
        }


        /* =====================================================
           CENTER CONTENT
        ====================================================== */

        .arrival-content {
            position: fixed;

            inset: 0;

            z-index: 10;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding:
                130px 24px
                170px;

            pointer-events: none;
        }


        #timeGreeting {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    48px,
                    11vw,
                    110px
                );

            font-weight: 400;

            line-height: 0.95;

            letter-spacing: -0.025em;

            color: var(--white);

            text-shadow:
                0 3px 25px
                rgba(0,0,0,0.22);
        }


        #arrivalMessage {
            max-width: 520px;

            margin-top: 24px;

            font-size:
                clamp(
                    12px,
                    2vw,
                    15px
                );

            font-weight: 300;

            line-height: 1.8;

            letter-spacing: 0.02em;

            color: var(--muted-white);

            text-shadow:
                0 2px 15px
                rgba(0,0,0,0.30);
        }


        /* =====================================================
           MEGHANA SIGNATURE
        ====================================================== */

        .founder-credit {
            display: flex;

            flex-direction: column;

            align-items: center;

            margin-top: 30px;
        }


        .founder-name {
            font-family: "Allura", cursive;

            font-size:
                clamp(
                    25px,
                    5vw,
                    42px
                );

            line-height: 1;

            color: var(--white);

            text-shadow:
                0 2px 14px
                rgba(0,0,0,0.30);
        }


        .founder-photo {
            width: 46px;
            height: 46px;

            margin-top: 10px;

            object-fit: cover;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.55);

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.22);
        }


        /* =====================================================
           BOTTOM CONTROLS
        ====================================================== */

        .arrival-controls {
            position: fixed;

            left: 50%;
            bottom:
                calc(
                    env(safe-area-inset-bottom) + 28px
                );

            transform:
                translateX(-50%);

            z-index: 20;

            width:
                min(
                    440px,
                    calc(100% - 40px)
                );

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 14px;
        }


        #beginButton {
            pointer-events: auto;

            min-width: 185px;

            padding:
                14px 27px;

            border:
                1px solid
                rgba(255,255,255,0.65);

            border-radius: 999px;

            background:
                rgba(0,0,0,0.14);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            color: var(--white);

            font-size: 10px;

            font-weight: 400;

            letter-spacing: 0.2em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }


        #beginButton:hover {
            background:
                rgba(255,255,255,0.16);

            transform:
                translateY(-2px);
        }


        #soundButton {
            pointer-events: auto;

            border: 0;

            background: transparent;

            color:
                rgba(255,255,255,0.78);

            font-size: 9px;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            cursor: pointer;
        }


        /* =====================================================
           VIDEO PROGRESS
        ====================================================== */

        .video-progress {
            position: fixed;

            left: 0;
            bottom: 0;

            z-index: 25;

            width: 100%;
            height: 2px;

            background:
                rgba(255,255,255,0.18);

            pointer-events: none;
        }


        #videoProgressBar {
            width: 0%;
            height: 100%;

            background:
                rgba(255,255,255,0.88);

            transition:
                width linear;
        }


        #videoIndicator {
            display: none;
        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        #arrivalNavigation {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            align-items: center;

            background:
                rgba(10,9,8,0.97);

            color: var(--white);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.45s ease,
                visibility 0.45s ease;
        }


        #arrivalNavigation.is-open {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        #closeMenuButton {
            position: absolute;

            top:
                calc(
                    env(safe-area-inset-top) + 18px
                );

            right: 18px;

            width: 48px;
            height: 48px;

            border: 0;

            background: transparent;

            cursor: pointer;
        }


        #closeMenuButton::before,
        #closeMenuButton::after {
            content: "";

            position: absolute;

            top: 50%;
            left: 50%;

            width: 27px;
            height: 1px;

            background: var(--white);
        }


        #closeMenuButton::before {
            transform:
                translate(-50%, -50%)
                rotate(45deg);
        }


        #closeMenuButton::after {
            transform:
                translate(-50%, -50%)
                rotate(-45deg);
        }


        .navigation-inner {
            width:
                min(
                    1050px,
                    calc(100% - 48px)
                );

            margin: 0 auto;
        }


        .navigation-caption {
            margin-bottom: 30px;

            color:
                rgba(255,255,255,0.42);

            font-size: 9px;

            letter-spacing: 0.22em;

            text-transform: uppercase;
        }


        .navigation-links {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                0 70px;
        }


        .navigation-links a {
            display: flex;

            align-items: baseline;

            gap: 15px;

            padding: 16px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(
                    29px,
                    4vw,
                    49px
                );

            line-height: 1;

            transition:
                color 0.3s ease,
                padding-left 0.3s ease;
        }


        .navigation-links a span {
            color:
                rgba(255,255,255,0.30);

            font-family:
                "Inter",
                sans-serif;

            font-size: 8px;

            letter-spacing: 0.12em;
        }


        .navigation-links a:hover {
            color: #d8c8b6;

            padding-left: 8px;
        }


        /* =====================================================
           PAGE TRANSITION
        ====================================================== */

        #pageTransition {
            position: fixed;

            inset: 0;

            z-index: 999;

            background: #090807;

            opacity: 1;

            transform:
                translateY(0);

            pointer-events: none;

            transition:
                opacity 0.85s
                cubic-bezier(.22,1,.36,1),

                transform 0.85s
                cubic-bezier(.22,1,.36,1);
        }


        #pageTransition.is-ready {
            opacity: 0;

            transform:
                translateY(-100%);
        }


        #pageTransition.is-active {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           DESKTOP
        ====================================================== */

        @media (min-width: 901px) {

            .arrival-date {
                left: 34px;
            }


            .arrival-brand-icon {
                width: 35px;
                height: 35px;
            }


            .arrival-brand-name {
                font-size: 31px;
            }


            .arrival-content {
                padding:
                    150px 60px
                    170px;
            }


            .founder-photo {
                width: 52px;
                height: 52px;
            }

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (
            min-width: 601px
        ) and (
            max-width: 900px
        ) {

            .arrival-content {
                padding:
                    130px 40px
                    160px;
            }


            #timeGreeting {
                font-size: 72px;
            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            .arrival-date {
                top:
                    calc(
                        env(safe-area-inset-top) + 19px
                    );

                left: 17px;
            }


            #arrivalDate {
                font-size: 8px;

                letter-spacing: 0.15em;
            }


            #arrivalDay {
                font-size: 15px;
            }


            .arrival-brand {
                top:
                    calc(
                        env(safe-area-inset-top) + 18px
                    );
            }


            .arrival-brand-icon {
                width: 27px;
                height: 27px;
            }


            .arrival-brand-name {
                font-size: 23px;
            }


            .arrival-brand-tagline {
                margin-top: 5px;

                font-size: 6px;

                letter-spacing: 0.18em;
            }


            #menuButton {
                top:
                    calc(
                        env(safe-area-inset-top) + 15px
                    );

                right: 13px;

                width: 42px;
                height: 42px;
            }


            .arrival-content {
                padding:
                    115px 20px
                    155px;
            }


            #timeGreeting {
                font-size:
                    clamp(
                        48px,
                        14vw,
                        75px
                    );
            }


            #arrivalMessage {
                max-width: 320px;

                margin-top: 20px;

                font-size: 12px;

                line-height: 1.75;
            }


            .founder-credit {
                margin-top: 26px;
            }


            .founder-name {
                font-size: 29px;
            }


            .founder-photo {
                width: 42px;
                height: 42px;

                margin-top: 8px;
            }


            .arrival-controls {
                bottom:
                    calc(
                        env(safe-area-inset-bottom) + 23px
                    );

                width:
                    calc(100% - 34px);
            }


            #beginButton {
                min-width: 175px;

                padding:
                    13px 23px;

                font-size: 9px;
            }


            #soundButton {
                font-size: 8px;
            }


            .navigation-inner {
                width:
                    calc(100% - 42px);
            }


            .navigation-links {
                grid-template-columns: 1fr;

                gap: 0;
            }


            .navigation-links a {
                font-size: 32px;

                padding: 13px 0;
            }

        }


        /* =====================================================
           VERY SMALL PHONES
        ====================================================== */

        @media (max-width: 380px) {

            .arrival-brand-icon {
                width: 24px;
                height: 24px;
            }


            .arrival-brand-name {
                font-size: 21px;
            }


            .arrival-brand-tagline {
                font-size: 5px;
            }


            #timeGreeting {
                font-size: 45px;
            }


            #arrivalMessage {
                font-size: 11px;
            }


            .founder-name {
                font-size: 26px;
            }

        }


        /* =====================================================
           LANDSCAPE MOBILE
        ====================================================== */

        @media (
            max-height: 520px
        ) and (
            orientation: landscape
        ) {

            .arrival-brand {
                top:
                    calc(
                        env(safe-area-inset-top) + 10px
                    );
            }


            .arrival-date {
                top:
                    calc(
                        env(safe-area-inset-top) + 11px
                    );
            }


            #menuButton {
                top:
                    calc(
                        env(safe-area-inset-top) + 7px
                    );
            }


            .arrival-content {
                padding:
                    80px 30px
                    95px;
            }


            #timeGreeting {
                font-size: 48px;
            }


            #arrivalMessage {
                margin-top: 10px;
            }


            .founder-credit {
                margin-top: 10px;
            }


            .founder-photo {
                width: 32px;
                height: 32px;
                margin-top: 5px;
            }


            .arrival-controls {
                bottom:
                    calc(
                        env(safe-area-inset-bottom) + 10px
                    );
            }

        }


        /* =====================================================
           REDUCED MOTION
        ====================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {
                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         SINGLE BACKGROUND VIDEO
    ====================================================== -->

    <video
        id="backgroundVideo"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        aria-hidden="true"
    >

        <source
            src="aksh-evening.1.mov"
            type="video/quicktime"
        >

    </video>


    <!-- =====================================================
         OVERLAY
    ====================================================== -->

    <div
        id="videoOverlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         DATE + DAY
    ====================================================== -->

    <div
        class="arrival-date"
        aria-hidden="true"
    >

        <span id="arrivalDate">
            14.08.2026
        </span>

        <span id="arrivalDay">
            Friday
        </span>

    </div>


    <!-- =====================================================
         CENTER BRAND
    ====================================================== -->

    <div
        class="arrival-brand"
        aria-label="AKSH Mental Wellness"
    >

        <div class="arrival-brand-main">

            <img
                class="arrival-brand-icon"
                src="aksh-icon.PNG"
                alt=""
            >

            <span class="arrival-brand-name">
                AKSH
            </span>

        </div>


        <span class="arrival-brand-tagline">
            A Safe Space For Every Mind
        </span>

    </div>


    <!-- =====================================================
         MENU BUTTON
    ====================================================== -->

    <button
        id="menuButton"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="arrivalNavigation"
    >

        <span
            class="menu-line"
            aria-hidden="true"
        ></span>

        <span
            class="menu-line"
            aria-hidden="true"
        ></span>

    </button>


    <!-- =====================================================
         MAIN ARRIVAL CONTENT
    ====================================================== -->

    <main
        class="arrival-content"
    >

        <h1 id="timeGreeting">
            Good Evening
        </h1>


        <p id="arrivalMessage">
            Let the day become quieter.
            Give yourself a moment.
        </p>


        <!-- =================================================
             FOUNDER
        ================================================== -->

        <div
            class="founder-credit"
        >

            <div
                class="founder-name"
            >
                Meghana Kaverappa
            </div>


            <img
                class="founder-photo"
                src="meghana.kaverappa.PNG"
                alt="Meghana Kaverappa"
            >

        </div>

    </main>


    <!-- =====================================================
         BOTTOM CONTROLS
    ====================================================== -->

    <div
        class="arrival-controls"
    >

        <button
            id="beginButton"
            type="button"
        >
            Begin Your Journey
        </button>


        <button
            id="soundButton"
            type="button"
            aria-pressed="false"
            aria-label="Enable sound"
        >

            <span data-sound-text>
                Sound Off
            </span>

        </button>

    </div>


    <!-- =====================================================
         VIDEO PROGRESS
    ====================================================== -->

    <div
        class="video-progress"
        aria-hidden="true"
    >

        <div
            id="videoProgressBar"
        ></div>

    </div>


    <span
        id="videoIndicator"
        aria-hidden="true"
    ></span>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <aside
        id="arrivalNavigation"
        aria-hidden="true"
    >

        <button
            id="closeMenuButton"
            type="button"
            aria-label="Close navigation"
        ></button>


        <div
            class="navigation-inner"
        >

            <div
                class="navigation-caption"
            >
                Explore AKSH
            </div>


            <nav
                class="navigation-links"
                aria-label="AKSH navigation"
            >

                <a href="aksh.html">
                    <span>01</span>
                    The World
                </a>


                <a href="the-mind.html">
                    <span>02</span>
                    The Mind
                </a>


                <a href="with-you.html">
                    <span>03</span>
                    With You
                </a>


                <a href="meghana-kaverappa.html">
                    <span>04</span>
                    Meghana
                </a>


                <a href="journey.html">
                    <span>05</span>
                    Journey
                </a>


                <a href="stories.html">
                    <span>06</span>
                    Stories
                </a>


                <a href="journal.html">
                    <span>07</span>
                    Journal
                </a>


                <a href="ai.html">
                    <span>08</span>
                    AKSH AI
                </a>


                <a href="booking.html">
                    <span>09</span>
                    Book a Session
                </a>

            </nav>

        </div>

    </aside>


    <!-- =====================================================
         PAGE TRANSITION
    ====================================================== -->

    <div
        id="pageTransition"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         NOTE
         JavaScript is intentionally loaded separately.
    ====================================================== -->

    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
