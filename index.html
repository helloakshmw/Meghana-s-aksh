<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#11110f"
  >

  <meta
    name="description"
    content="AKSH — A Safe Space For Every Mind."
  >

  <title>AKSH — A Safe Space For Every Mind</title>

  <style>
    :root {
      --white: #ffffff;
      --soft-white: rgba(255, 255, 255, 0.88);
      --muted-white: rgba(255, 255, 255, 0.68);
      --glass: rgba(0, 0, 0, 0.18);
      --glass-border: rgba(255, 255, 255, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11110f;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      color: var(--white);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    a {
      font: inherit;
    }

    /* =========================================================
       PAGE
    ========================================================= */

    .arrival {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
      overflow: hidden;
      background: #11110f;
      isolation: isolate;
    }

    /* =========================================================
       BACKGROUND VIDEO
    ========================================================= */

    .video-container {
      position: absolute;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background: #11110f;
    }

    #arrivalVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      opacity: 0;

      transform: scale(1.025);

      transition:
        opacity 1.2s ease,
        transform 12s ease;

      will-change: opacity, transform;
    }

    #arrivalVideo.loaded {
      opacity: 1;
      transform: scale(1);
    }

    /* =========================================================
       CINEMATIC OVERLAYS
    ========================================================= */

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .overlay-main {
      z-index: 1;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.38) 0%,
          rgba(0, 0, 0, 0.08) 28%,
          rgba(0, 0, 0, 0.04) 58%,
          rgba(0, 0, 0, 0.44) 100%
        );
    }

    .overlay-vignette {
      z-index: 2;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 38%,
          rgba(0, 0, 0, 0.22) 100%
        );
    }

    /* =========================================================
       CONTENT
    ========================================================= */

    .page-content {
      position: relative;
      z-index: 10;

      width: 100%;
      height: 100%;

      padding:
        max(24px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(26px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));

      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .top-bar {
      position: relative;

      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    /* =========================================================
       DATE + DAY
    ========================================================= */

    .date-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;

      text-shadow:
        0 2px 16px rgba(0, 0, 0, 0.48);
    }

    .date-text {
      font-size: clamp(11px, 1.35vw, 14px);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    .day-text {
      margin-top: 3px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(12px, 1.45vw, 15px);
      font-weight: 400;
      line-height: 1.35;

      color: rgba(255, 255, 255, 0.78);

      letter-spacing: 0.025em;
    }

    /* =========================================================
       CENTRE BRAND
    ========================================================= */

    .brand {
      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .brand-icon-frame {
      width: 58px;
      height: 58px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        rgba(0, 0, 0, 0.13);

      border:
        1px solid
        rgba(255, 255, 255, 0.36);

      box-shadow:
        0 10px 34px rgba(0, 0, 0, 0.22);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      display: block;

      object-fit: contain;

      filter: none;
    }

    .brand-name {
      margin-top: 9px;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.42em;
      padding-left: 0.42em;

      color: #ffffff;

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.55);
    }

    .brand-tagline {
      margin-top: 5px;

      font-size: 7.5px;
      font-weight: 400;

      letter-spacing: 0.13em;

      color: rgba(255, 255, 255, 0.82);

      white-space: nowrap;

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.5);
    }

    /* =========================================================
       TOP RIGHT
    ========================================================= */

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .control-button {
      width: 41px;
      height: 41px;

      border:
        1px solid
        rgba(255, 255, 255, 0.34);

      border-radius: 50%;

      background:
        rgba(0, 0, 0, 0.14);

      color: #ffffff;

      display: grid;
      place-items: center;

      cursor: pointer;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
    }

    .control-button:active {
      transform: scale(0.92);
    }

    .control-button:hover {
      background:
        rgba(255, 255, 255, 0.11);

      border-color:
        rgba(255, 255, 255, 0.7);
    }

    .control-button svg {
      width: 17px;
      height: 17px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      flex: 1;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        80px 12px
        100px;
    }

    .greeting {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          58px,
          10vw,
          118px
        );

      font-weight: 400;

      line-height: 0.95;

      letter-spacing: -0.055em;

      color: #ffffff;

      text-shadow:
        0 7px 34px rgba(0, 0, 0, 0.38);

      animation:
        greeting-enter 1.2s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    .quote {
      max-width: 570px;

      margin-top: 26px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          16px,
          1.8vw,
          22px
        );

      line-height: 1.5;

      font-weight: 400;

      color:
        rgba(255, 255, 255, 0.91);

      text-shadow:
        0 4px 24px rgba(0, 0, 0, 0.38);

      animation:
        quote-enter 1.25s
        0.12s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    .time-label {
      margin-top: 18px;

      font-size: 9px;

      font-weight: 500;

      letter-spacing: 0.32em;

      padding-left: 0.32em;

      color:
        rgba(255, 255, 255, 0.65);

      text-transform: uppercase;

      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.4);

      animation:
        quote-enter 1.25s
        0.22s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    /* =========================================================
       BOTTOM
    ========================================================= */

    .bottom-area {
      position: relative;

      min-height: 86px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .begin-button {
      min-width: 238px;
      min-height: 56px;

      padding:
        0 28px 0 31px;

      border:
        1px solid
        rgba(255, 255, 255, 0.62);

      border-radius: 999px;

      background:
        rgba(0, 0, 0, 0.17);

      color: #ffffff;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 15px;

      cursor: pointer;

      text-decoration: none;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 0.22em;
      padding-left:
        calc(31px + 0.22em);

      text-transform: uppercase;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 12px 42px rgba(0, 0, 0, 0.2);

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;

      animation:
        button-enter 1.35s
        0.28s
        cubic-bezier(0.22, 1, 0.36, 1)
        both;
    }

    .begin-button:hover {
      transform: translateY(-2px);

      background:
        rgba(255, 255, 255, 0.12);

      border-color:
        rgba(255, 255, 255, 0.9);

      box-shadow:
        0 17px 52px rgba(0, 0, 0, 0.25);
    }

    .begin-button:active {
      transform: scale(0.97);
    }

    .arrow {
      width: 18px;
      height: 18px;

      display: grid;
      place-items: center;
    }

    .arrow svg {
      width: 18px;
      height: 18px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;

      transition:
        transform 0.3s ease;
    }

    .begin-button:hover .arrow svg {
      transform: translateX(4px);
    }

    /* =========================================================
       SKIP
    ========================================================= */

    .skip-button {
      position: absolute;

      right: 0;
      bottom: 2px;

      border: 0;

      background: transparent;

      color:
        rgba(255, 255, 255, 0.72);

      font-size: 9px;

      font-weight: 500;

      letter-spacing: 0.2em;

      text-transform: uppercase;

      cursor: pointer;

      padding: 9px;

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.5);

      transition:
        color 0.25s ease;
    }

    .skip-button:hover {
      color: #ffffff;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading-screen {
      position: absolute;
      inset: 0;

      z-index: 100;

      background: #11110f;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity 0.9s ease,
        visibility 0.9s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-icon {
      width: 48px;
      height: 48px;

      object-fit: contain;

      animation:
        icon-breathe 2s ease-in-out infinite;
    }

    /* =========================================================
       PAGE TRANSITION
    ========================================================= */

    .page-transition {
      position: fixed;
      inset: 0;

      z-index: 200;

      background: #11110f;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.75s ease;
    }

    .page-transition.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes greeting-enter {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes quote-enter {
      from {
        opacity: 0;
        transform: translateY(17px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes button-enter {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes icon-breathe {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .page-content {
        padding:
          max(20px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      .brand-icon-frame {
        width: 52px;
        height: 52px;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
      }

      .brand-name {
        margin-top: 7px;
        font-size: 9px;
      }

      .brand-tagline {
        font-size: 6.5px;
      }

      .date-text {
        font-size: 10px;
      }

      .day-text {
        font-size: 11px;
      }

      .control-button {
        width: 38px;
        height: 38px;
      }

      .hero {
        padding:
          72px 4px
          94px;
      }

      .greeting {
        font-size:
          clamp(
            50px,
            15vw,
            84px
          );
      }

      .quote {
        max-width: 340px;
        margin-top: 21px;
        font-size: 16px;
      }

      .time-label {
        margin-top: 16px;
      }

      .begin-button {
        min-width: 220px;
        min-height: 54px;

        font-size: 9px;
      }

      .skip-button {
        bottom: 0;
        font-size: 8px;
      }
    }

    /* =========================================================
       SMALL PHONES
    ========================================================= */

    @media (max-width: 375px) {

      .page-content {
        padding-left: 15px;
        padding-right: 15px;
      }

      .brand-icon-frame {
        width: 47px;
        height: 47px;
      }

      .brand-icon {
        width: 34px;
        height: 34px;
      }

      .brand-tagline {
        display: none;
      }

      .date-text {
        font-size: 9px;
      }

      .day-text {
        font-size: 10px;
      }

      .greeting {
        font-size: 47px;
      }

      .quote {
        font-size: 15px;
      }

      .begin-button {
        min-width: 205px;
      }
    }

    /* =========================================================
       LANDSCAPE
    ========================================================= */

    @media (
      max-height: 520px
    ) and (
      orientation: landscape
    ) {

      .page-content {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .brand-icon-frame {
        width: 40px;
        height: 40px;
      }

      .brand-icon {
        width: 29px;
        height: 29px;
      }

      .brand-name {
        margin-top: 3px;
        font-size: 7px;
      }

      .brand-tagline {
        display: none;
      }

      .hero {
        padding:
          20px 10px
          28px;
      }

      .greeting {
        font-size: 47px;
      }

      .quote {
        margin-top: 10px;
        font-size: 13px;
      }

      .time-label {
        margin-top: 7px;
      }

      .bottom-area {
        min-height: 54px;
      }

      .begin-button {
        min-height: 43px;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      #arrivalVideo {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <main class="arrival">

    <!-- =======================================================
         VIDEO
    ======================================================== -->

    <div class="video-container">

      <video
        id="arrivalVideo"
        autoplay
        playsinline
        webkit-playsinline
        preload="auto"
        loop
      ></video>

      <div class="overlay overlay-main"></div>
      <div class="overlay overlay-vignette"></div>

    </div>


    <!-- =======================================================
         LOADING
    ======================================================== -->

    <div
      id="loadingScreen"
      class="loading-screen"
      aria-hidden="true"
    >

      <img
        class="loading-icon"
        src="aksh-icon.PNG"
        alt=""
      >

    </div>


    <!-- =======================================================
         PAGE CONTENT
    ======================================================== -->

    <div class="page-content">

      <!-- TOP -->

      <header class="top-bar">

        <!-- DATE -->

        <div class="date-block">

          <div
            id="dateText"
            class="date-text"
          >
            12 August 2026
          </div>

          <div
            id="dayText"
            class="day-text"
          >
            Wednesday
          </div>

        </div>


        <!-- BRAND -->

        <div class="brand">

          <div class="brand-icon-frame">

            <img
              class="brand-icon"
              src="aksh-icon.PNG"
              alt="AKSH"
            >

          </div>

          <div class="brand-name">
            AKSH
          </div>

          <div class="brand-tagline">
            A SAFE SPACE FOR EVERY MIND
          </div>

        </div>


        <!-- SOUND -->

        <div class="top-actions">

          <button
            id="soundButton"
            class="control-button"
            type="button"
            aria-label="Turn sound on"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
              <path d="m18 9-4 6"></path>
              <path d="m14 9 4 6"></path>
            </svg>

          </button>

        </div>

      </header>


      <!-- HERO -->

      <section class="hero">

        <h1
          id="greeting"
          class="greeting"
        >
          Good Afternoon
        </h1>

        <p
          id="quote"
          class="quote"
        >
          Pause for a moment. You deserve a little space.
        </p>

        <div
          id="timeLabel"
          class="time-label"
        >
          AKSH · AFTERNOON
        </div>

      </section>


      <!-- BOTTOM -->

      <footer class="bottom-area">

        <a
          id="beginButton"
          class="begin-button"
          href="home.html"
          aria-label="Begin Your Journey"
        >

          <span>
            Begin Your Journey
          </span>

          <span
            class="arrow"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">
              <path d="M5 12h13"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>

          </span>

        </a>


        <button
          id="skipButton"
          class="skip-button"
          type="button"
        >
          Skip
        </button>

      </footer>

    </div>


    <!-- TRANSITION -->

    <div
      id="pageTransition"
      class="page-transition"
      aria-hidden="true"
    ></div>

  </main>


  <script>

      },


      /* -------------------------------------------------------
         EVENING — 5:45 PM → 6:59 PM
      ------------------------------------------------------- */

      {
        start: 17.75,
        end: 19,
        greeting: "Good Evening",
        period: "EVENING",
        quote:
          "It is okay to slow down and simply exist.",
        video:
          "aksh-evening.2.mov"
      },


      /* -------------------------------------------------------
         EVENING — 7:00 PM → 7:59 PM
      ------------------------------------------------------- */

      {
        start: 19,
        end: 20,
        greeting: "Good Evening",
        period: "EVENING",
        quote:
          "Look a little further. There is always another horizon.",
        video:
          "aksh-evening.3.mov"
      },


      /* -------------------------------------------------------
         NIGHT — 8:00 PM → 11:59 PM
      ------------------------------------------------------- */

      {
        start: 20,
        end: 24,
        greeting: "Good Night",
        period: "NIGHT",
        quote:
          "You are safe to rest. Tomorrow can wait.",
        video:
          "aksh-night.1.mov"
      }

    ];


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const video =
      document.getElementById("arrivalVideo");

    const loadingScreen =
      document.getElementById("loadingScreen");

    const dateText =
      document.getElementById("dateText");

    const dayText =
      document.getElementById("dayText");

    const greeting =
      document.getElementById("greeting");

    const quote =
      document.getElementById("quote");

    const timeLabel =
      document.getElementById("timeLabel");

    const soundButton =
      document.getElementById("soundButton");

    const skipButton =
      document.getElementById("skipButton");

    const pageTransition =
      document.getElementById("pageTransition");


    let activeVideo = "";

    let soundUnlocked = false;


    /* =========================================================
       GET LOCAL TIME
    ========================================================= */

    function getLocalDecimalHour() {

      const now = new Date();

      return (
        now.getHours() +
        now.getMinutes() / 60 +
        now.getSeconds() / 3600
      );

    }


    /* =========================================================
       FIND EXPERIENCE
    ========================================================= */

    function getExperience() {

      const hour =
        getLocalDecimalHour();

      return EXPERIENCES.find(
        experience =>
          hour >= experience.start &&
          hour < experience.end
      );

    }


    /* =========================================================
       DATE + DAY
    ========================================================= */

    function updateDateAndDay() {

      const now = new Date();

      const dateFormatter =
        new Intl.DateTimeFormat(
          "en-IN",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const dayFormatter =
        new Intl.DateTimeFormat(
          "en-IN",
          {
            weekday: "long"
          }
        );

      dateText.textContent =
        dateFormatter.format(now);

      dayText.textContent =
        dayFormatter.format(now);

    }


    /* =========================================================
       UPDATE TEXT
    ========================================================= */

    function updateExperienceText(
      experience
    ) {

      greeting.textContent =
        experience.greeting;

      quote.textContent =
        experience.quote;

      timeLabel.textContent =
        `AKSH · ${experience.period}`;

    }


    /* =========================================================
       LOAD VIDEO
    ========================================================= */

    function loadExperience() {

      const experience =
        getExperience();

      if (!experience) {
        return;
      }


      updateExperienceText(
        experience
      );


      /*
       * Prevent unnecessary video reloads.
       */

      if (
        activeVideo ===
        experience.video
      ) {
        return;
      }


      activeVideo =
        experience.video;


      video.classList.remove(
        "loaded"
      );


      video.pause();


      video.src =
        experience.video;


      video.load();


      const onLoaded =
        () => {

          video.classList.add(
            "loaded"
          );

          loadingScreen.classList.add(
            "hidden"
          );


          /*
           * First attempt audio autoplay.
           */

          attemptSound();


          /*
           * Always make sure the video itself
           * can play.
           */

          video.play().catch(
            () => {

              video.muted = true;

              video.play().catch(
                () => {}
              );

            }
          );

        };


      video.addEventListener(
        "loadeddata",
        onLoaded,
        {
          once: true
        }
      );


      video.addEventListener(
        "error",
        () => {

          loadingScreen.classList.add(
            "hidden"
          );

        },
        {
          once: true
        }
      );

    }


    /* =========================================================
       SOUND AUTOPLAY
    ========================================================= */

    function attemptSound() {

      /*
       * iPhone/Safari may block sound autoplay.
       * We try it first.
       */

      video.muted = false;

      const playPromise =
        video.play();

      if (
        playPromise &&
        typeof playPromise.catch ===
          "function"
      ) {

        playPromise.catch(
          () => {

            /*
             * Safari blocked automatic audio.
             * Video continues muted until user
             * taps the sound control or interacts.
             */

            video.muted = true;

            updateSoundButton(
              false
            );

          }
        );

      }

    }


    /* =========================================================
       SOUND BUTTON
    ========================================================= */

    function updateSoundButton(
      enabled
    ) {

      if (enabled) {

        soundButton.innerHTML = `
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
            <path d="M17 8.5c1.9 1.9 1.9 5.1 0 7"></path>
            <path d="M19.5 6c3.2 3.2 3.2 8.8 0 12"></path>
          </svg>
        `;

        soundButton.setAttribute(
          "aria-label",
          "Mute sound"
        );

      } else {

        soundButton.innerHTML = `
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
            <path d="m18 9-4 6"></path>
            <path d="m14 9 4 6"></path>
          </svg>
        `;

        soundButton.setAttribute(
          "aria-label",
          "Turn sound on"
        );

      }

    }


    soundButton.addEventListener(
      "click",
      event => {

        event.preventDefault();

        event.stopPropagation();


        if (video.muted) {

          video.muted = false;

          soundUnlocked = true;

          video.play().catch(
            () => {}
          );

          updateSoundButton(
            true
          );

        } else {

          video.muted = true;

          updateSoundButton(
            false
          );

        }

      }
    );


    /* =========================================================
       FIRST USER INTERACTION
    ========================================================= */

    function unlockSound() {

      if (
        soundUnlocked ||
        !video.src
      ) {
        return;
      }

      video.muted = false;

      video.play().then(
        () => {

          soundUnlocked = true;

          updateSoundButton(
            true
          );

        }
      ).catch(
        () => {

          video.muted = true;

        }
      );

    }


    document.addEventListener(
      "touchstart",
      unlockSound,
      {
        passive: true,
        once: true
      }
    );


    document.addEventListener(
      "pointerdown",
      unlockSound,
      {
        once: true
      }
    );


    /* =========================================================
       SKIP
    ========================================================= */

    skipButton.addEventListener(
      "click",
      () => {

        goToHome();

      }
    );


    /* =========================================================
       BEGIN JOURNEY
    ========================================================= */

    document
      .getElementById("beginButton")
      .addEventListener(
        "click",
        event => {

          event.preventDefault();

          goToHome();

        }
      );


    /* =========================================================
       PAGE TRANSITION
    ========================================================= */

    function goToHome() {

      pageTransition.classList.add(
        "active"
      );


      setTimeout(
        () => {

          window.location.href =
            "home.html";

        },
        700
      );

    }


    /* =========================================================
       KEEP TIME SYNCHRONISED
    ========================================================= */

    setInterval(
      () => {

        updateDateAndDay();

        loadExperience();

      },
      1000
    );


    /* =========================================================
       INITIALISE
    ========================================================= */

    updateDateAndDay();

    updateSoundButton(
      false
    );

    loadExperience();

  </script>

</body>
</html>
